<title>ZYNTH Command</title>
<style>
:root{--bg:#050708;--panel:#0a1013;--teal:#22D3EE;--violet:#A78BFA;--blue:#60A5FA;
--gold:#D4AF37;--tealSoft:#2DD4BF;--text:#EAF0F2;--dim:#8A97A0;--line:#14201f;
--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
#app{display:flex;height:100vh;width:100%;overflow:hidden}
#side{width:224px;flex-shrink:0;display:flex;flex-direction:column;border-right:1px solid #111b1f;background:rgba(10,16,19,.6)}
.brandrow{display:flex;align-items:center;gap:8px}
.diamond{width:20px;height:20px;transform:rotate(45deg);border:2px solid var(--teal);box-shadow:0 0 12px var(--teal)}
.brandname{letter-spacing:.3em;font-size:12px;font-weight:600}
.brandsub{font-size:8px;letter-spacing:.25em;margin-top:4px;color:var(--dim)}
#side .pad{padding:20px}
nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:4px}
nav button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14px;
background:transparent;color:var(--dim);border:1px solid transparent;cursor:pointer;font-family:inherit;text-align:left;
transition:background .15s,color .15s,border-color .15s}
nav button:hover{color:var(--text)}
nav button.on{background:rgba(34,211,238,.1);color:var(--teal);border-color:rgba(34,211,238,.25)}
nav button:focus-visible,.card:focus-visible,.orow:focus-visible,.lensbtn:focus-visible,.fbtn:focus-visible,#q:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.vault{padding:16px 20px;font-size:9px;line-height:1.6;color:rgba(138,151,160,.6)}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--tealSoft);display:inline-block;margin-right:6px;box-shadow:0 0 6px var(--tealSoft)}
#main{flex:1;position:relative;overflow:hidden}
.page{position:absolute;inset:0;overflow-y:auto;padding:28px 32px;background:radial-gradient(1000px 500px at 60% -10%,#0a1216,var(--bg))}
.wrapx{max-width:1000px}
h1.head{font-size:20px;font-weight:300;margin:0}
p.sub{font-size:12px;color:var(--dim);margin:4px 0 24px}
.chip{font-size:9px;letter-spacing:.08em;padding:2px 8px;border-radius:4px;display:inline-block}
.eyebrow{font-size:10px;letter-spacing:.2em;color:var(--teal);margin-bottom:12px}
.hero{border-radius:16px;padding:24px;margin-bottom:20px;background:rgba(10,16,19,.7);border:1px solid rgba(212,175,55,.25)}
.hero .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.hero h2{font-size:18px;font-weight:400;margin:0}
.bar{margin-top:16px;height:6px;border-radius:3px;background:#121a1e}
.bar>i{display:block;height:6px;border-radius:3px;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.box{border-radius:12px;padding:20px;background:rgba(10,16,19,.6);border:1px solid var(--line)}
.kpi{border-radius:12px;padding:16px;background:rgba(10,16,19,.7)}
.kpi .lab{font-size:9px;letter-spacing:.2em;color:var(--dim)}
.kpi .val{font-size:30px;font-weight:200;margin-top:4px;font-variant-numeric:tabular-nums}
.card{text-align:left;border-radius:12px;padding:18px;background:rgba(10,16,19,.6);border:1px solid rgba(212,175,55,.18);
cursor:pointer;color:inherit;font-family:inherit;transition:border-color .18s,transform .18s,background .18s}
.card:hover{border-color:rgba(212,175,55,.55);transform:translateY(-2px);background:rgba(10,16,19,.85)}
.card.concept{border-color:rgba(138,151,160,.16)}
.card.concept:hover{border-color:rgba(34,211,238,.4)}
.card .t{font-size:13px;margin:8px 0 10px;line-height:1.4}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
#q{background:rgba(10,16,19,.8);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--text);
font-family:inherit;font-size:13px;min-width:220px}
#q::placeholder{color:var(--dim)}
.fbtn{font-size:10px;letter-spacing:.06em;padding:5px 11px;border-radius:999px;border:1px solid #1a2529;background:transparent;
color:var(--dim);cursor:pointer;font-family:inherit}
.fbtn.on{border-color:var(--teal);color:var(--teal);background:rgba(34,211,238,.1)}
.prow{border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;
background:rgba(10,16,19,.6);border:1px solid var(--line)}
.prow .n{font-size:14px}.prow .s{font-size:10px;color:var(--dim)}
.stage{border-radius:12px;overflow:hidden;background:rgba(10,16,19,.6);border:1px solid var(--line)}
.stage .sw{height:96px;position:relative}
.olist{border-radius:12px;overflow:hidden;background:rgba(10,16,19,.6);border:1px solid var(--line)}
.orow{width:100%;display:flex;align-items:center;gap:12px;padding:12px 20px;text-align:left;background:transparent;
border:0;border-top:1px solid #101a1e;cursor:pointer;font-family:inherit;color:#c9d3d8;font-size:14px;transition:background .15s}
.orow:first-child{border-top:0}.orow:hover{background:rgba(34,211,238,.06)}
#reader{position:fixed;inset:0;z-index:40;display:none;justify-content:center;background:rgba(3,5,6,.7);backdrop-filter:blur(6px)}
#reader.on{display:flex}
#readerin{width:100%;max-width:672px;height:100%;overflow-y:auto;overflow-x:hidden;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.rhead{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;padding:16px 32px;
background:rgba(5,7,8,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.rbody{padding:32px}.rbody h1{font-size:24px;font-weight:300;margin:0 0 8px}
.blk{margin-bottom:28px}.blk .lab{font-size:10px;letter-spacing:.22em;color:var(--teal);margin-bottom:12px}
.tier{border-radius:12px;padding:16px;text-align:center}
.btnrow{margin-top:32px;padding-top:24px;border-top:1px solid var(--line);display:flex;gap:12px}
.btnrow a,.btnrow button{flex:1;padding:10px;border-radius:8px;font-size:12px;letter-spacing:.08em;cursor:pointer;
font-family:inherit;text-align:center;text-decoration:none;display:block}
#sphere{position:absolute;inset:0}
#cv{position:absolute;inset:0;cursor:grab;touch-action:none}#cv:active{cursor:grabbing}
.ovl{position:absolute;pointer-events:none}
#title{top:20px;left:24px}
#title .a{font-size:14px;letter-spacing:.3em;font-weight:600}
#title .b{font-size:10px;letter-spacing:.25em;margin-top:4px;color:var(--dim)}
#lenses{position:absolute;top:20px;right:24px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.lensbtn{font-size:9px;letter-spacing:.1em;padding:4px 10px;border-radius:999px;border:1px solid #1a2529;background:transparent;
color:var(--dim);cursor:pointer;font-family:inherit}
.lensbtn.on{border-color:var(--teal);color:var(--teal);background:rgba(34,211,238,.1)}
#legend{position:absolute;bottom:20px;left:24px;font-size:9px;color:var(--dim);line-height:1.9}
#legend .sw{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
#insp{position:absolute;top:0;right:0;height:100%;width:340px;transform:translateX(110%);
transition:transform .5s cubic-bezier(.16,1,.3,1);background:rgba(6,10,12,.88);backdrop-filter:blur(16px);
border-left:1px solid rgba(34,211,238,.18);padding:64px 24px 24px;font-size:14px;overflow-y:auto}
#insp.on{transform:translateX(0)}
.krow{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:12px;border-bottom:1px solid var(--line)}
.iconbtn{background:transparent;border:0;color:var(--text);cursor:pointer;padding:6px;line-height:0;opacity:.6}
.iconbtn:hover{opacity:1}
.doc h3{font-size:15px;font-weight:600;margin:28px 0 10px;color:var(--text);letter-spacing:.01em}
.doc h4{font-size:12px;font-weight:600;margin:20px 0 8px;color:var(--tealSoft);letter-spacing:.06em;text-transform:uppercase}
.doc p{font-size:14px;line-height:1.75;color:#c9d3d8;margin:0 0 12px}
.doc ul{margin:0 0 14px;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.doc li{font-size:14px;line-height:1.65;color:#c9d3d8;display:flex;gap:9px}
.doc li:before{content:"◆";color:var(--gold);flex-shrink:0}
.doc{max-width:100%;overflow-wrap:anywhere}
.doc .tw{overflow-x:auto;max-width:100%;margin:0 0 18px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.doc table{border-collapse:collapse;width:100%;font-size:12.5px;min-width:420px}
.doc th,.doc td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;color:#c9d3d8;overflow-wrap:anywhere;max-width:340px}
.doc th{background:rgba(34,211,238,.07);color:var(--tealSoft);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.doc td{font-variant-numeric:tabular-nums}
.doc tr:last-child td{border-bottom:0}
.doc strong{color:var(--text);font-weight:600}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 28px}
.toc a{font-size:10px;letter-spacing:.04em;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
color:var(--dim);text-decoration:none}
.toc a:hover{border-color:var(--teal);color:var(--teal)}
.sec-cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 22px}
.sec-cov div{border-radius:9px;padding:9px 12px;background:rgba(10,16,19,.6);border:1px solid var(--line);
display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:11.5px}
.sec-cov .nm{color:#c9d3d8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-cov .ct{font-variant-numeric:tabular-nums;letter-spacing:.06em;white-space:nowrap;font-size:10px}
.drivewarn{border-radius:10px;padding:12px 14px;font-size:11.5px;line-height:1.6;color:#c9a94e;
background:rgba(212,175,55,.07);border:1px solid rgba(212,175,55,.25);margin:0 0 20px}
.stamp{font-size:9px;color:rgba(138,151,160,.55);margin-top:20px;letter-spacing:.04em}
@media (max-width:820px){
 #side{width:60px}#side .brandsub,#side nav span,#side .vault{display:none}
 nav button{justify-content:center;padding:12px 0}
 .grid2,.grid3,.grid4{grid-template-columns:1fr}#insp{width:100%}.page{padding:20px 16px}
 #lenses{max-width:none;left:24px;right:24px;justify-content:flex-start;top:auto;bottom:150px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
 <div id="side">
  <div class="pad">
   <div class="brandrow"><div class="diamond"></div><span class="brandname">ZYNTH</span></div>
   <div class="brandsub">COMMAND · THE INTELLIGENCE OF CREATIVITY</div>
  </div>
  <nav id="nav"></nav>
  <div class="vault"><span class="dotlive"></span>vault linked<br>github.com/zanezynthbrain<br>/zynth-brain<br><span id="stamp"></span></div>
 </div>
 <div id="main">
  <div id="sphere">
   <canvas id="cv"></canvas>
   <div class="ovl" id="title"><div class="a">SECOND BRAIN · SPHERE</div><div class="b" id="subtitle"></div></div>
   <div id="lenses"></div><div id="legend"></div><div id="insp"></div>
  </div>
  <div class="page" id="page" style="display:none"></div>
 </div>
</div>
<div id="reader"><div id="readerin"></div></div>

<script>
const VAULT=/*__VAULT_JSON__*/{"proposals":[],"agents":[],"skills":[],"stages":[],"deliverables":[],"counts":{},"generated_at":""};
const C={bg:"#050708",magenta:"#F472B6",teal:"#22D3EE",violet:"#A78BFA",blue:"#60A5FA",gold:"#D4AF37",tealSoft:"#2DD4BF",text:"#EAF0F2",dim:"#8A97A0"};
const hx=(c,a)=>c+Math.round(a*255).toString(16).padStart(2,"0");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const SVG=(d,sz)=>`<svg width="${sz||16}" height="${sz||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I={brain:'<path d="M12 5a3 3 0 0 0-3 3v8a3 3 0 0 0 3 3 3 3 0 0 0 3-3V8a3 3 0 0 0-3-3Z"/><path d="M9 8a3 3 0 0 1-3 3 3 3 0 0 0 0 6"/><path d="M15 8a3 3 0 0 0 3 3 3 3 0 0 1 0 6"/>',
activity:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',rocket:'<path d="M4.5 16.5c-1.5 1.3-2 5-2 5s3.7-.5 5-2a2.1 2.1 0 0 0-3-3Z"/><path d="M12 15 9 12a11 11 0 0 1 6-9 11 11 0 0 1 6 6 11 11 0 0 1-9 6Z"/>',
file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/>',
box:'<path d="M21 8v8a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
folder:'<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 17 9 5 9-5"/><path d="m3 12 9 5 9-5"/>',
rotate:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',chev:'<path d="m9 18 6-6-6-6"/>',
ext:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>'};
const star=f=>`<svg width="11" height="11" viewBox="0 0 24 24" fill="${f?C.gold:"none"}" stroke="${f?C.gold:"#2a3a40"}" stroke-width="2"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1Z"/></svg>`;

const HUBS=[{id:"creative",label:"CREATIVE STUDIO"},{id:"events",label:"EVENTS & EXPERIENTIAL"},{id:"growth",label:"GROWTH & MEDIA"},{id:"bd",label:"BUSINESS DEV"},{id:"ops",label:"FINANCE & OPS"},{id:"research",label:"RESEARCH & KNOWLEDGE"},{id:"outputs",label:"OUTPUTS & PROPOSALS"}];
/* The hub maps encode clustering only. Every LIST below comes from the vault scan,
   so adding or deleting a file in the repo changes this interface. */
const HUB_AGENT={brand_strategist:"creative",copywriter:"creative",content_creator:"creative",design_director:"creative",designer:"creative",motion_designer:"creative",myanmar_copy_chief:"creative",portfolio:"creative",video_master:"creative",event_concept:"events",event_designer:"events",event_manager:"events",event_ops:"events",paid_ads:"growth",research_seo:"growth",cmo:"growth",lead_gen:"bd",master_proposal:"bd",proposal_factory:"bd",ceo:"ops",coo:"ops",cfo:"ops",hr:"ops",operations:"ops",market_researcher:"research"};
const HUB_SKILL={"zynth-3d-design-studio":"creative","zynth-3d-production":"creative","zynth-commercial-video-studio":"creative","zynth-creative-video-director":"creative","zynth-video-producer":"creative","zynth-art-director":"creative","zynth-creative-director":"creative","zynth-content-strategist":"creative","zynth-copywriter":"creative","zynth-brand-strategist":"creative","zynth-social-media-manager":"creative","zynth-master-event-planner":"events","zynth-event-manager":"events","zynth-sponsorship-value":"events","zynth-paid-media-specialist":"growth","zynth-seo-specialist":"growth","zynth-analytics-specialist":"growth","zynth-campaign-planner":"growth","zynth-master-campaign-planner":"growth","zynth-campaign-requirements":"growth","zb-icp":"bd","zb-objections":"bd","zb-offer":"bd","zb-pitch-kit":"bd","zynth-bd-researcher":"bd","zynth-bd-pitch-prep":"bd","zynth-account-manager":"bd","zynth-competitor-analyst":"bd","zynth-market-researcher":"bd","zynth-vendor-finder":"bd","zynth-pitch-packager":"bd","zynth-master-proposal-writer":"bd","yadana-finance":"ops","zynth-project-manager":"ops","graphify":"ops","zynth-tactical-prompts":"ops"};
const AGENTS=Object.fromEntries(VAULT.agents.map(a=>[a.id,HUB_AGENT[a.id]||"ops"]));
const SKILLS=Object.fromEntries(VAULT.skills.map(n=>[n,HUB_SKILL[n]||"ops"]));
const AGENT_LABEL=Object.fromEntries(VAULT.agents.map(a=>[a.id,a.label||a.id]));
const PROPOSALS=VAULT.proposals||[],COMPOSED_LIST=PROPOSALS.filter(p=>p.composed),POOL_LIST=PROPOSALS.filter(p=>!p.composed);
const DELIVERABLES=VAULT.deliverables||[],STAGE=VAULT.stages||[];
const BY_TITLE=Object.fromEntries(PROPOSALS.map(p=>[p.title,p]));
const PROSPECTS=[["KBZ Bank","Banking & Fintech",5],["AYA Bank","Banking & Fintech",5],["CB Bank","Banking & Fintech",5],["Yoma Bank","Banking & Fintech",5],["Wave Money / WavePay","Fintech",5],["Ooredoo Myanmar","Telecom",5],["ATOM Myanmar","Telecom",5],["MPT","Telecom",5],["Capital Diamond Star (CDSG)","FMCG",5],["City Mart Holding","Retail",5],["Loi Hein","FMCG",5],["Myanmar Brewery","FMCG",5],["Shwe Taung Group","Real Estate",5],["Yoma Land","Real Estate",5],["Pun Hlaing Siloam","Healthcare",5],["Super Seven Stars","Automotive",5],["UAB Bank","Banking & Fintech",4]];

document.getElementById("stamp").textContent="scanned "+(VAULT.generated_at||"").replace("T"," ").slice(0,16);
document.getElementById("subtitle").textContent=
 `${(VAULT.counts.proposals||0)} PROPOSALS · ${(VAULT.counts.agents||0)} AGENTS · ${(VAULT.counts.skills||0)} SKILLS — LIVE FROM THE REPO`;

/* ============================ NAV / PAGES ============================ */
const NAV=[["brain","Second Brain",I.brain],["ongoing","Ongoing",I.activity],["execute","To Execute",I.rocket],["proposals","Proposals",I.file],["studio","3D Studio",I.box],["outputs","Outputs",I.folder]];
let tab="brain";
const chip=(t,c)=>`<span class="chip" style="background:${hx(c||C.teal,.12)};color:${c||C.teal}">${esc(t)}</span>`;
const head=(t,s)=>`<h1 class="head">${esc(t)}</h1><p class="sub">${esc(s)}</p>`;
document.getElementById("nav").innerHTML=NAV.map(([id,l,ic])=>`<button data-tab="${id}" class="${id===tab?"on":""}">${SVG(ic)}<span>${l}</span></button>`).join("");
document.getElementById("nav").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.tab);};
function go(t){tab=t;
 [...document.querySelectorAll("#nav button")].forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
 const sp=document.getElementById("sphere"),pg=document.getElementById("page");
 if(t==="brain"){sp.style.display="";pg.style.display="none";requestAnimationFrame(resize);}
 else{sp.style.display="none";pg.style.display="";pg.scrollTop=0;pg.innerHTML=PAGES[t]();if(t==="proposals")wireProposals();}}

const PAGES={
 ongoing:()=>`<div class="wrapx">${head("Ongoing","Live projects and the always-on workforce.")}
  <div class="hero"><div class="top"><div>
   <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap"><h2>IGNITE Myanmar Business Summit 2026</h2>${chip("OWNED IP",C.gold)}${chip("PROPOSAL",C.gold)}</div>
   <p style="font-size:12px;color:var(--dim);margin:0">ZYNTH flagship · Yangon · 14 Nov 2026 · 300 delegates</p></div>
   <div style="text-align:right"><div style="font-size:18px;color:var(--tealSoft)">198M MMK</div><div style="font-size:10px;color:var(--dim)">inventory</div></div></div>
   <p style="font-size:12px;margin:12px 0 0;line-height:1.6;color:#9fb0b6">Sponsorship-funded. Lean build clears the 35% margin floor at 43% sell-through. Financial model + sponsor prospectus already produced.</p>
   <div class="bar"><i style="width:55%"></i></div></div>
  <div class="grid2"><div class="box"><div class="eyebrow">ALWAYS-ON WORKFORCE (YANGON TIME)</div>
   ${[["06:30","Market research sweep"],["07:00","FX refresh"],["08:00","Founder morning brief"],["18:00","End-of-day roll-up"],["21:00","Consolidation + learning"]]
    .map(([a,b])=>`<div style="display:flex;gap:12px;padding:6px 0;font-size:12px;color:#c9d3d8"><span style="width:48px;color:var(--tealSoft);font-variant-numeric:tabular-nums">${a}</span>${b}</div>`).join("")}</div>
   <div class="box"><div class="eyebrow">WHAT THE SCAN FOUND</div>
   ${[[VAULT.counts.composed+" proposals fully composed — client-ready"],[VAULT.counts.pooled+" more in the concept pool"],

/* ---- sector coverage: shows where the library is thin, instead of claiming it is complete ---- */
function normSector(s){
  /* the vault and the generated pool name sectors differently ("F&B",
     "Food & Beverage", "F&B & Restaurant"). Keyword rules merge them so the
     coverage map counts one sector once. */
  const t=(s||"").toLowerCase();
  const R=[[/bank|fintech|financ|payment|wallet/,"Banking & Fintech"],
   [/f&b|food|beverage|restaurant|qsr/,"F&B"],
   [/retail|shopping|mall|fashion|e-commerce|ecommerce/,"Retail"],
   [/health|medic|pharma|clinic|wellness/,"Healthcare"],
   [/educat|edtech|school|learning/,"Education"],
   [/real estate|property|proptech/,"Real Estate"],
   [/hospitality|hotel|tourism|travel|resort/,"Hospitality"],
   [/manufactur|industr|factory/,"Manufacturing"],
   [/telecom|technology|saas|software/,"Telecom & Tech"],
   [/automotive|auto|vehicle/,"Automotive"],
   [/fmcg|consumer goods/,"FMCG"],
   [/marketing|advertis|agency/,"Marketing & Advertising"],
   [/energy|utilit/,"Energy"],[/logistic|supply/,"Logistics"],
   [/ngo|impact|social/,"NGO & Impact"]];
  for(const[re,name]of R)if(re.test(t))return name;
  return (s||"Unclassified").split("/")[0].split("(")[0].trim()||"Unclassified";
}
function sectorCoverage(){
  const m={};
  PROPOSALS.forEach(p=>{const k=normSector(p.sector);
    (m[k]=m[k]||{full:0,comp:0,con:0})[p.full?"full":p.composed?"comp":"con"]++;});
  return Object.entries(m).sort((a,b)=>
      (b[1].full-a[1].full)||(b[1].comp-a[1].comp)||(b[1].con-a[1].con)||a[0].localeCompare(b[0]))
    .map(([k,v])=>{
      const strong=v.full||v.comp;
      return `<div style="border-color:${strong?hx(C.gold,.3):"var(--line)"}"><span class="nm">${esc(k)}</span>
      <span class="ct">${v.full?`<span style="color:${C.gold}">★${v.full}</span> `:""}${v.comp?`<span style="color:${C.tealSoft}">●${v.comp}</span> `:""}<span style="color:${strong?"var(--dim)":"#6b7780"}">○${v.con}</span></span></div>`;
    }).join("");
}

/* ---- markdown -> html, enough for a real client document ---- */
function mdInline(t){
  return esc(t).replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
               .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener" style="color:var(--teal)">$1</a>');
}
function mdToHtml(md){
  const lines=md.split("\n");const out=[];let i=0;
  const flushList=buf=>{if(buf.length){out.push("<ul>"+buf.map(x=>"<li>"+mdInline(x)+"</li>").join("")+"</ul>");buf.length=0;}};
  const buf=[];
  while(i<lines.length){
    const ln=lines[i];
    if(/^\s*\|.*\|\s*$/.test(ln)){                       // table
      flushList(buf);
      const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){
        const cells=lines[i].trim().replace(/^\||\|$/g,"").split(/(?<!\\)\|/).map(c=>c.replace(/\\\|/g,"|").trim());
        rows.push(cells);i++;}
      const clean=rows.filter(r=>!r.every(c=>/^-{2,}$/.test(c)||c===""));
      if(clean.length){
        out.push('<div class="tw"><table><thead><tr>'+clean[0].map(c=>"<th>"+mdInline(c)+"</th>").join("")+"</tr></thead><tbody>"+
          clean.slice(1).map(r=>"<tr>"+r.map(c=>"<td>"+mdInline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>");}
      continue;}
    if(/^\s*[-*]\s+/.test(ln)){buf.push(ln.replace(/^\s*[-*]\s+/,""));i++;continue;}
    if(/^\s*$/.test(ln)){flushList(buf);i++;continue;}
    if(/^#{3,4}\s+/.test(ln)){flushList(buf);out.push("<h4>"+mdInline(ln.replace(/^#+\s+/,""))+"</h4>");i++;continue;}
    flushList(buf);out.push("<p>"+mdInline(ln)+"</p>");i++;
  }
  flushList(buf);
  return out.join("");
}

const TYPE={agent:{c:C.teal},skill:{c:C.violet},research:{c:C.blue},knowledge:{c:C.blue},project:{c:C.gold},proposal:{c:C.gold},concept:{c:C.gold},deliverable:{c:C.gold},hub:{c:C.tealSoft}};
const RAD={hub:1.0,agent:.87,skill:.79,proposal:.97,concept:.80,deliverable:.93,project:.66,research:.73,knowledge:.73};
const FOV=2.7,AUTO=0.00072,IDLE_MS=2500,PULSE_MS=4200;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fib(n){const p=[],ga=Math.PI*(3-Math.sqrt(5));for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,r=Math.sqrt(1-y*y),th=ga*i;p.push([Math.cos(th)*r,y,Math.sin(th)*r]);}return p;}
const norm=v=>{const m=Math.hypot(...v)||1;return[v[0]/m,v[1]/m,v[2]/m];};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function nearHub(dir,seed,k){const rnd=mulberry(seed);const ru=norm([rnd()*2-1,rnd()*2-1,rnd()*2-1]);k=k||.72;return norm([dir[0]*k+ru[0]*(1-k),dir[1]*k+ru[1]*(1-k),dir[2]*k+ru[2]*(1-k)]);}
function buildNodes(){
  const hubDirs={};fib(7).forEach((d,i)=>hubDirs[HUBS[i].id]=d);const out=[];let s=1;
  HUBS.forEach(h=>out.push({id:h.id,label:h.label,type:"hub",hub:h.id,v:hubDirs[h.id],r:RAD.hub}));
  const add=(id,label,type,hub,by,spread)=>{s+=97;const rnd=mulberry(s*7+13);
    out.push({id,label,type,hub,by,v:nearHub(hubDirs[hub],s,spread),r:(RAD[type]||.85)*(.90+rnd()*.19)});};
  Object.entries(AGENTS).forEach(([n,h])=>add("ag:"+n,(AGENT_LABEL[n]||n).replace(/_/g," "),"agent",h));
  Object.entries(SKILLS).forEach(([n,h])=>add("sk:"+n,n.replace(/^zynth-/,"").replace(/-/g," "),"skill",h));
  /* composed proposals sit proud on the surface; the concept pool sits deeper and
     spreads wider, so the eye reads "12 finished, 75 waiting" without being told. */
  COMPOSED_LIST.forEach((p,i)=>add("pr:"+i,p.title,"proposal","outputs","master_proposal",.80));
  POOL_LIST.forEach((p,i)=>add("cp:"+i,p.title,"concept","outputs","proposal_factory",.42));

  add("kn:0","Knowledge Base","knowledge","research");

}
function makeSprite(col){const s=96,o=document.createElement("canvas");o.width=o.height=s;const g=o.getContext("2d");

 gr.addColorStop(0,hx(col,.60));gr.addColorStop(.28,hx(col,.20));gr.addColorStop(.6,hx(col,.05));gr.addColorStop(1,hx(col,0));
 g.fillStyle=gr;g.fillRect(0,0,s,s);return o;}
function makeSky(w,h){const o=document.createElement("canvas");o.width=w;o.height=h;const g=o.getContext("2d");
 g.fillStyle=C.bg;g.fillRect(0,0,w,h);const rnd=mulberry(20260816);
 g.globalCompositeOperation="lighter";
 /* deep clouds first, then tighter brighter cores inside them — a nebula is
    layered depth, not one flat wash. */
 [[.28,.30,C.teal,.16,.52],[.74,.22,C.violet,.15,.46],[.58,.80,C.magenta,.12,.44],
  [.16,.70,C.tealSoft,.10,.40],[.86,.62,C.blue,.10,.38],[.44,.46,C.violet,.06,.62]
 ].forEach(([fx,fy,col,a,sz])=>{
  const x=w*fx,y=h*fy,r=Math.max(w,h)*sz*(.8+rnd()*.4);
  const gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,hx(col,a));gr.addColorStop(.45,hx(col,a*.35));gr.addColorStop(1,hx(col,0));
  g.fillStyle=gr;g.fillRect(0,0,w,h);});
 [[.30,.31,C.teal,.22],[.73,.24,C.violet,.20],[.57,.79,C.magenta,.17]].forEach(([fx,fy,col,a])=>{
  const x=w*fx,y=h*fy,r=Math.max(w,h)*(.07+rnd()*.05);
  const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,hx(col,a));gr.addColorStop(1,hx(col,0));
  g.fillStyle=gr;g.fillRect(0,0,w,h);});
 /* dust lanes: darker streaks so the cloud has structure instead of blur */

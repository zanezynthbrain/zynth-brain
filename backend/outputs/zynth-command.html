<script>
const VAULT={"generated_at":"2026-08-19T01:28:59","proposals":[{"id":"Ask-For-The-Cook-FB-Restaurant-Group-Campaign","title":"Ask for the Cook — Myanmar Restaurant Group Retention Campaign","file":"vault/ZYNTH-OS/Proposal-Library/Ask-For-The-Cook-FB-Restaurant-Group-Campaign.md","sector":"F&B — restaurant group, multi-outlet, dine-in + delivery","market":"Myanmar (Yangon, Mandalay)","type":"Integrated retention campaign — engineered for the second visit","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. CAMPAIGN OVERVIEW","md":"Myanmar restaurant marketing is a discount treadmill. Platform promo, 20% off,\nfootfall spikes, margin drops, the customer eats once and never returns because\nnothing except the price was memorable. Next month the promo runs again, deeper.\n\nThe economics are brutal and well understood by the operator: a first visit\nbought at 20% off is barely break-even. **Every peso of profit in this business\nlives in the second visit, and almost nobody markets for it.**\n\n**Objective.** Lift 60-day repeat rate from baseline by **14 points** across the\ngroup, raise delivery re-order rate by 18%, and reduce average discount depth by\n5 points — over 16 weeks, without buying footfall.\n\n**Period.** 16 weeks. **Budget envelope.** MMK 58,000,000.\n\n**The bet.** A discount is forgettable by design. A person is not."},{"level":3,"h":"Segment A — The Repeat-Capable Diner (the whole campaign)","md":"**Demographics.** 24–42, office workers and small-business owners, MMK 500k–2M\nmonthly household income, eats out or orders 4–10 times a month.\n**Location.** Within 4km of an outlet — Yangon (Bahan, Kamayut, Sanchaung,\nHlaing), Mandalay Chan Aye Thar Zan.\n**Psychographics.** Has 6–8 places in rotation and rarely adds one. Adds a place\nwhen something specific happened, not because it was cheap.\n**Behaviours.** Decides in 40 seconds on a delivery app. Screenshots and shares\nfood. Returns to places where staff recognise them.\n**Pain points.** Inconsistency — the dish is different on the second visit;\nnobody to tell when something is wrong; the discount ends and so does the reason.\n**Media.** Facebook 12–1 PM and 7–10 PM, TikTok evenings, delivery app browsing\nat decision moment, Viber with friends."},{"level":3,"h":"Segment B — The Group Organiser (highest ticket)","md":"**Demographics.** 28–45, chooses the venue for 6–15 people — office lunch,\nfamily Sunday, birthday.\n**Psychographics.** Carries social risk. If the venue disappoints, it is *their*\nrecommendation that failed.\n**Pain points.** No confidence the kitchen holds up under a big order; booking is\na phone call that may not be answered; no way to pre-agree the menu.\n**Media.** Facebook, Viber groups, direct calls."},{"level":3,"h":"Segment C — The Kitchen Staff (internal, and non-negotiable)","md":"**Demographics.** 19–45, line cooks, sous chefs, station leads. Often invisible\nin the brand.\n**Psychographics.** Trained, proud, and never named. High turnover partly because\nthe work is anonymous.\n**Why they are a campaign audience.** This campaign puts their names in public.\nIf they are not brought in first, as participants and not as content, it fails —\nand it deserves to."},{"level":2,"h":"3. COMPETITIVE LANDSCAPE","md":"| Who | What they do | The gap we take |\n|---|---|---|\n| Delivery-platform-led restaurants | Promo depth, platform ranking | Buys visits, builds no relationship, margin bleeds |\n| Big local chains | Consistency, locations, brand recall | Anonymous, industrial, no reason to feel loyal |\n| Independent \"chef\" restaurants | A named owner-chef, personality | One person, one outlet, cannot scale the intimacy |\n| International franchises | Systems and reliability | Culturally distant, priced above the segment |\n\nNobody has scaled *personal* accountability across multiple outlets. The\nindependents have it and cannot grow it; the chains grew and lost it. That gap is\nthe whole opportunity."},{"level":3,"h":"The big idea — \"Ask for the Cook\" / \"စားဖိုမှူးကို မေးပါ\"","md":"Every dish that leaves the kitchen carries the name of the person who cooked it —\non the table card, on the receipt, on the delivery bag sticker. And the invitation\nis explicit: **if it was good, ask for them by name. If it was not, ask for them\nanyway.**\n\nThe cook is no longer an anonymous function behind a wall. They are a person you\ncan request, thank, or complain to. That is a reason to come back that a 20%\ndiscount structurally cannot produce — and a competitor cannot copy it without\nfirst being willing to let their kitchen be named.\n\n**Why this and not the obvious one.** The obvious campaign is slow-motion food, a\nsizzle, and \"Taste the Difference\". It is beautiful, it is interchangeable, and it\ndrives a first visit at best. Naming the cook changes the *product*, not the\nadvertising — which is why it survives the campaign ending.\n\n**Brand positioning.** The kitchen you can talk to.\n\n**Key messages.**\n- \"Cooked by [name].\" — on every dish, every channel, every outlet.\n- \"Ask for them next time.\" — the return mechanic, stated as an invitation.\n- \"Tell them yourself.\" — complaints routed to the kitchen, answered publicly.\n- \"Same hands, same dish.\" — consistency framed as a person, not a process.\n\n**Tone of voice.** Warm, specific, unpolished. Burmese written first, everyday\nregister. Real kitchen sound. No food-porn narration, no \"culinary journey\".\n\n**Hashtags.** Primary `#စားဖိုမှူးကိုမေးပါ` · Secondary `#AskForTheCook` `#CookedBy`"},{"level":3,"h":"The internal move that makes it real","md":"Before a single ad runs: cooks opt in by name, are paid a **recognition\nallowance** when requested by customers, and are trained on the complaint route.\nIf the kitchen does not want this, the campaign does not run. We would rather\nsay that in week one than discover it in week six."},{"level":2,"h":"5. CHANNEL STRATEGY","md":"| Channel | Role | Share |\n|---|---|---|\n| In-outlet + packaging | Where the idea actually lives — cards, receipts, delivery stickers | 26% |\n| Facebook | Cook profiles, complaint responses, the return invitation | 30% |\n| TikTok | Kitchen-real content — the hands, the heat, the speed | 20% |\n| Delivery platforms | Menu-item naming, re-order prompts, in-app storefront | 14% |\n| Viber / CRM | The actual return trigger — \"your cook is on tonight\" | 10% |\n\nThe Viber line is small in budget and large in effect. It is the only channel that\ncan tell a specific customer that a specific person is working tonight."},{"level":2,"h":"6. CONTENT PLAN","md":"**Pillars.** The Cook 35% · The Dish 25% · The Return 25% · The Answer 15%.\n\n| Week | The Cook | The Dish | The Return | The Answer |\n|---|---|---|---|---|\n| 1–4 | Cook profiles, 8 outlets (8) | Signature dish, one cook each (4) | \"Ask for them\" explainer (2) | First public complaint answered (1) |\n| 5–8 | Night-shift film (2) | Consistency test film (1) | Repeat-diner stories (3) | Complaint round-up (1) |\n| 9–12 | Cook trains new starter (2) | Group-order kitchen film (2) | \"Your cook is on\" Viber launch | Kitchen answers 10 questions (2) |\n| 13–16 | Most-requested cooks named (2) | Seasonal dish, cook-led (2) | 60-day repeat milestone (1) | Quarter response log (1) |\n\n**Sample draft — Facebook, Week 2 (Burmese first)**\n\n> ဒီည သင့်ခေါက်ဆွဲကို ချက်ပေးမှာက **မသီရိ** ပါ။\n> သူ ဒီမီးဖိုချောင်မှာ ၆ နှစ်ရှိပါပြီ။ ကြက်သားဆီပြန်ကို သူ့လက်ရာ အကောင်းဆုံးလို့ ပြောကြပါတယ်။\n> စားလို့ကောင်းရင် နောက်တစ်ခေါက် သူ့နာမည်နဲ့ မှာလိုက်ပါ။\n> မကောင်းရင်လည်း သူ့ကိုပဲ ပြောပါ — ကျွန်တော်တို့ ပြန်ဖြေပါမယ်။\n>\n> *Tonight your noodles are cooked by Ma Thiri. Six years in this kitchen. They\n> say her chicken si-byan is the best thing she makes. If it's good, order it by\n> her name next time. If it isn't — tell her anyway. We'll answer.*\n\n**Sample draft — TikTok, Week 3 (18s, no music)**\n\n> One unbroken shot of a wok station at 7:20 PM. Four dishes, ninety seconds\n> compressed to fifteen. No cuts, no voiceover, only the sound of the burner and\n> the pan. Name card at the end: \"ကိုအောင်မျိုး · ၄ နှစ်\" (Ko Aung Myo · 4 years).\n> Nothing else. The skill is the content."},{"level":2,"h":"7. OUTREACH STRATEGY","md":"| Tier | Who | Deliverable | Fee band (MMK) |\n|---|---|---|---|\n| Food creator | 4 mid-tier Yangon food voices | Visit, order by a cook's name, film the ask | 800,000 each |\n| Authority | 2 respected local food writers | Honest multi-outlet consistency review, published unedited | 1,400,000 each |\n| Diner | 15 existing repeat customers | Filmed \"why I came back\" at the table | Meal cost only |\n| Staff | 8 cooks | They are the campaign — recognition allowance, not a fee | Allowance, see §10 |\n\nThe consistency review is the risky one and the valuable one. A food writer\neating the same dish at three outlets and publishing the difference is the exact\ntest the brand is claiming to pass."},{"level":2,"h":"8. PAID MEDIA PLAN","md":"| Platform | Objective | Budget (MMK) | Audience | Expected |\n|---|---|---|---|---|\n| Facebook | Reach — cook profiles | 6,500,000 | 4km radius per outlet, 24–45, dining interests | CPM 3,000–4,200 |\n| Facebook | Retargeting — the return invitation | 5,000,000 | Past engagers + customer list | CPC 180–320 |\n| TikTok | Kitchen content, brand | 5,500,000 | 20–38, food & local interests | CPV 38–70 |\n| Delivery platforms | In-app placement + re-order | 4,000,000 | Past orderers, category browsers | CPO 1,900–3,400 |\n| Viber | CRM broadcast | 1,500,000 | Opted-in customers | — |\n| **Total** | | **22,500,000** | | |\n\n**No discount spend in this plan.** Not one line. That is deliberate: the campaign\nis testing whether a non-price reason to return works, and mixing in promo would\nmake the result unreadable."},{"level":2,"h":"9. ACTIVATION — THE COOK'S TABLE","md":"Once a month, at rotating outlets, **The Cook's Table**: twelve seats, one cook,\none menu they chose themselves, and they serve it. Guests book by the cook's\nname. No host, no MC, no speeches — the cook talks about the food or does not.\n\nFour across the campaign. Priced at cost, capped at twelve, always full within a\nday. It is the campaign's most photographed asset and its cheapest."},{"level":2,"h":"10. DETAILED BUDGET","md":"| Line | Unit | Qty | Rate (MMK) | Total (MMK) |\n|---|---|---|---|---|\n| Content production — crew | day | 12 | 750,000 | 9,000,000 |\n| Editing + subtitling (MM/EN) | asset | 34 | 155,000 | 5,270,000 |\n| In-outlet materials (table cards, receipt reprint, delivery stickers) | outlet | 8 | 620,000 | 4,960,000 |\n| Paid media (see §8) | — | — | — | 22,500,000 |\n| Creator + food-writer fees | — | — | — | 6,000,000 |\n| Cook recognition allowance (16 weeks) | cook-month | 32 | 90,000 | 2,880,000 |\n| The Cook's Table | event | 4 | 1,150,000 | 4,600,000 |\n| CRM / Viber setup + segmentation | build | 1 | 2,700,000 | 2,700,000 |\n| Campaign management (16 weeks) | month | 4 | 2,350,000 | 9,400,000 |\n| **Subtotal** | | | | **67,310,000** |\n| Contingency 10% | | | | 6,731,000 |\n| **Cost base** | | | | **74,041,000** |"},{"level":2,"h":"11. TIMELINE","md":"| Weeks | Phase | Milestones |\n|---|---|---|\n| 1–2 | Kitchen first | Cook opt-in, allowance agreed, complaint route trained, baseline repeat rate measured |\n| 3–4 | Materials | Cards, receipts, stickers live across 8 outlets. Campaign is visible in-outlet before it is visible online. |\n| 5–8 | Launch | Cook profiles, TikTok kitchen content, first complaint answered publicly, Cook's Table 1 |\n| 9–12 | Return mechanic | Viber \"your cook is on tonight\" launches, retargeting at weight, Tables 2–3 |\n| 13–16 | Prove | Consistency review published, most-requested cooks named, 60-day repeat measured, Table 4 |\n\nThe order matters. In-outlet before online — if a customer sees the ad and the\ntable card is not there, the idea dies on the first visit."},{"level":2,"h":"12. KPIs & SUCCESS METRICS","md":"| Metric | Target | Source |\n|---|---|---|\n| 60-day repeat rate | +14 points vs baseline | POS customer data |\n| Delivery re-order rate | +18% | Platform dashboards |\n| Average discount depth | −5 points | POS |\n| Orders placed naming a cook | 3,200 cumulative | POS flag |\n| Cook's Table bookings | 48 seats, 100% fill | Booking log |\n| Complaints answered publicly | 100% | Response log |\n| Kitchen staff retention | +12 points vs prior 16 weeks | HR |\n\nBaseline repeat rate must be pulled in week 1 from POS. Without it the headline\nnumber is unprovable and we will not report it."},{"level":2,"h":"13. ROI PROJECTION","md":"Group baseline: 42,000 covers/month, average ticket MMK 14,500, contribution\nmargin 58%. A 14-point repeat lift is modelled on the repeat-capable base only.\n\n| Scenario | Repeat lift | Incremental covers/mo | Year-1 contribution (MMK) | Return on 123M |\n|---|---|---|---|---|\n| Conservative | +8 pts | 2,240 | 226,000,000 | 1.8× |\n| Base | +14 pts | 3,920 | 395,000,000 | 3.2× |\n| Upside | +19 pts | 5,320 | 536,000,000 | 4.4× |\n\nPlus the discount effect: a 5-point reduction in average discount depth on\nexisting volume is worth roughly **MMK 106,000,000 a year** in recovered margin on\nits own — and unlike the repeat lift, it starts the week the promos are cut."},{"level":2,"h":"14. RISK & MITIGATION","md":"| Risk | Likelihood | Impact | Mitigation | Owner |\n|---|---|---|---|---|\n| Kitchen staff do not want to be named | Medium | **High** | Opt-in only, week 1, before any spend. If uptake is below 60% the campaign does not launch — we will not pressure staff into being content. | ZYNTH + client HR |\n| A named cook receives abuse from a customer | Medium | **High** | Complaints route to the manager first, never directly to the cook; publicly answered by the brand, not the individual; named cooks are never exposed to a public pile-on | Client ops |\n| Consistency review finds real inconsistency | **High** | Medium | Publish it and publish the fix. If consistency is badly broken, delay the review until month 3 — but do not cancel it. | ZYNTH |\n| A named cook leaves mid-campaign | **High** | Low | Content is portfolio, not dependency; departures acknowledged warmly, never hidden | Client ops |\n| Discount withdrawal drops volume before repeat lift arrives | Medium | High | Taper discounts over weeks 3–8 rather than cutting; watch weekly covers, restore if drop exceeds 12% | Client + ZYNTH |\n| Delivery platform ranking falls without promo | **High** | Medium | Offset with in-app content placement and re-order prompts, budgeted in §8 | ZYNTH |"},{"level":2,"h":"15. ZYNTH FEE & PROFIT MODEL","md":"| Line | MMK |\n|---|---|\n| Cost base (incl. contingency) | 74,041,000 |\n| **Client investment at 40% margin** | **123,402,000** |\n| ZYNTH gross margin | 49,361,000 (40.0%) |\n\nClears the 35% floor at the 40% target. **50% deposit on signature**, 25% at week\n8, 25% on the final report. Market FX. Vendor lines RFQ-based and reconciled at\nactuals; underspend returns to the client.\n\nReduced version: six outlets instead of eight and two Cook's Tables\n(−MMK 3,600,000 cost base → 117,402,000). We will not cut the recognition\nallowance or the in-outlet materials — the first is the ethics of the idea and the\nsecond is the idea itself."},{"level":2,"h":"16. WHY ZYNTH","md":"Most agencies will pitch this group a discount calendar, because it is easy to\nsell, easy to approve, and easy to report. It also loses money on purpose. We are\nproposing a campaign with **zero discount spend**, which means it can only work if\nthe idea works — and we have put the measurement in §12 so you can tell.\n\nThe other thing this campaign requires is a client willing to let their kitchen be\nnamed and their complaints be public. If the answer to that is no, this is the\nwrong campaign and we would rather establish it in week one.\n\nWhat we have actually produced: a 20-section fintech launch proposal with full\nsegmentation and scenario modelling; a premium launch event proposal with complete\nvendor and risk registers; manufacturing, logistics, energy and NGO campaigns;\na spec product film to commercial sound standards; eight 3D stage and exhibition\nconcepts.\n\nWhat we do not claim: a multi-outlet restaurant group client. This would be our\nfirst at this scale, and we would rather say so than invent a case study.\n\n---\n\n*ZYNTH — The Intelligence of Creativity · zynth.asia*\n*Figures indicative, vendor lines subject to RFQ. Market FX. 50% deposit on signature.*"}],"full":true,"words":2783,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Ask-for-the-Cook-Myanmar-Restaurant-Group-Retention-Campaign.docx","docx_kb":44.9},{"id":"Built-To-Be-Trusted-Manufacturing-Industry-Campaign","title":"Built to be Trusted — Myanmar Manufacturing Sector Campaign","file":"vault/ZYNTH-OS/Proposal-Library/Built-To-Be-Trusted-Manufacturing-Industry-Campaign.md","sector":"Manufacturing & Industrial","market":"Myanmar (Yangon, Mandalay, Thilawa SEZ)","type":"Integrated B2B campaign — brand authority + demand generation","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. CAMPAIGN OVERVIEW","md":"Myanmar manufacturers sell on price because nobody has given buyers another\nreason to choose. Procurement managers at distributors, hotel groups, and\nconstruction firms compare quotes on a spreadsheet — and a spreadsheet only has\na column for cost. The manufacturer with the better factory loses to the one\nwith the lower number, and then both are squeezed again next quarter.\n\nThis campaign moves one manufacturer out of that column.\n\n**Objective.** 120 qualified inbound enquiries and 25 factory visits over 16\nweeks, at a cost per qualified lead at or below **MMK 45,000** — against a\nYangon B2B outbound benchmark of roughly MMK 110,000 per meeting.\n\n**Period.** 16 weeks. **Budget envelope.** MMK 62,000,000.\n\n**The bet.** In a market where every competitor claims quality, the one who\n*shows* it wins. Not a slogan — an open factory."},{"level":3,"h":"Segment A — The Procurement Manager","md":"**Demographics.** 30–45, mixed gender, mid-senior at a distributor, hotel group,\nconstruction firm or FMCG brand. Signs or shortlists for MMK 20–500M annually.\n**Location.** Yangon (Downtown, Bahan), Mandalay industrial belt.\n**Psychographics.** Personally accountable for a failure nobody remembers when\nit goes right. Will pay 8–12% more for a supplier who will not embarrass them.\n**Behaviours.** Researches on Facebook and Viber, decides in person. Asks peers\nbefore asking Google. Wants a factory visit before a first order.\n**Pain points.** Late delivery with no warning; inconsistent batch quality; no\ndocumentation for their own auditors; suppliers who vanish when a defect appears.\n**Media.** Facebook 8–10 PM, Viber business groups all day, LinkedIn rarely,\nindustry WhatsApp groups constantly. Trade press: Myanmar Business Today."},{"level":3,"h":"Segment B — The Factory Owner / Managing Director","md":"**Demographics.** 40–60, owner-operator, 50–400 staff, second generation common.\n**Psychographics.** Proud of the plant, frustrated it is invisible. Believes\nmarketing is for consumer brands and has been sold three websites that did nothing.\n**Pain points.** Losing tenders to cheaper, worse competitors; no way to prove\ncapability without a site visit; every enquiry arrives through a personal contact.\n**Media.** Facebook, Viber, chamber-of-commerce events, WhatsApp."},{"level":3,"h":"Segment C — The International Sourcing Agent","md":"**Demographics.** 28–45, based Singapore/Bangkok, sourcing for regional buyers.\n**Psychographics.** Risk-averse on Myanmar. Needs evidence of compliance,\ncapacity and continuity before recommending a supplier upward.\n**Pain points.** Cannot verify claims remotely; no English documentation;\nunclear certifications; no idea if the factory can hold volume.\n**Media.** LinkedIn, email, industry directories, video walkthroughs."},{"level":2,"h":"3. COMPETITIVE LANDSCAPE","md":"Myanmar industrial marketing is close to a vacuum, which is the opportunity.\n\n| Who | What they do now | The gap we take |\n|---|---|---|\n| Local manufacturers | A Facebook page with product photos, updated rarely | No proof, no process, no people |\n| Regional importers (Thai, Chinese) | Polished catalogues, real certifications | Long lead times, no local service, no relationship |\n| Trading intermediaries | Own the buyer relationship, hide the factory | We put the factory in front of the buyer directly |\n\nNobody in this category is publishing evidence. The first manufacturer to show\nits floor, its process and its people owns \"trustworthy\" before anyone else\nthinks to compete for it."},{"level":3,"h":"The big idea — \"Built to be Trusted\" / \"ယုံကြည်ရဖို့ တည်ဆောက်ထားတယ်\"","md":"Every competitor says quality. We do not say it. **We open the doors.**\n\nThe campaign is one long act of transparency: the factory floor filmed without\nstaging, the QC bench shown mid-rejection, the line supervisor explaining the\ntolerance in her own words, the delivery log published monthly whether it is\ngood or bad. Trust is not claimed. It is demonstrated, publicly, repeatedly.\n\n**Why this and not the obvious one.** The obvious campaign is a corporate film\nwith drone shots, a handshake, and \"Quality You Can Trust\". It is beautiful, it\nis forgettable, and a competitor can copy it in a month. An open factory cannot\nbe copied by anyone who is not actually confident in their floor — which is the\nwhole point, and the reason it defends the price premium.\n\n**Brand positioning.** The supplier you can send your auditor to unannounced.\n\n**Key messages.**\n- \"Come and see.\" — an open-door standing invitation, not a campaign line.\n- \"Every batch documented.\" — QC records issued with delivery, to the buyer's auditors.\n- \"The people who make it.\" — named operators, not stock photography.\n- \"On time, on record.\" — delivery performance published monthly, including misses.\n\n**Tone of voice.** Plain, specific, unhurried. Numbers over adjectives. Burmese\nwritten first (professional register, not colloquial); English transcreated for\nSegment C. Never boastful — the evidence carries it.\n\n**Hashtags.** Primary `#BuiltToBeTrusted` · Secondary `#မြန်မာ့ထုတ်လုပ်မှု` `#OpenFactoryMM`"},{"level":2,"h":"5. CHANNEL STRATEGY","md":"| Channel | Role | Share |\n|---|---|---|\n| Facebook | The proof archive — long-form floor content, delivery reports, live Q&A | 40% |\n| Viber | The relationship channel — business communities where procurement actually talks | 20% |\n| LinkedIn + email | Segment C only — English documentation, capability decks, direct outreach | 15% |\n| On-ground | Open Factory Days and two trade fairs — where the deal is actually closed | 20% |\n| Trade press / PR | Third-party credibility for the sceptical buyer | 5% |\n\nFacebook and Viber carry Myanmar; LinkedIn carries the region. On-ground closes."},{"level":2,"h":"6. CONTENT PLAN","md":"**Pillars.** The Floor 40% · The Standard 25% · The People 20% · The Record 15%.\n\n| Week | The Floor | The Standard | The People | The Record |\n|---|---|---|---|---|\n| 1–4 | Line walkthrough films (4) | \"How we reject a batch\" (2) | Operator portraits (3) | Baseline delivery report |\n| 5–8 | Raw-material sourcing (2) | Tolerance explainer (2) | Supervisor Q&A live (1) | Month 1 on-time % |\n| 9–12 | Capacity under load (2) | Certification walkthrough (2) | Night-shift film (1) | Month 2 + a public miss |\n| 13–16 | Customer site visit films (3) | Audit-ready documentation (1) | 10-year staff feature (2) | Quarter summary |\n\n**Sample draft — Facebook, Week 2 (Burmese first)**\n\n> ဒီအိတ်က ဒီနေ့ ပယ်လိုက်တဲ့ ၁၄ အိတ်ထဲက တစ်အိတ်ပါ။\n> အလေးချိန် ၂ ဂရမ် လွဲနေလို့ပါ။ ဖောက်သည်က သတိထားမိမှာ မဟုတ်ပါဘူး။ ဒါပေမဲ့ ကျွန်တော်တို့ သိပါတယ်။\n> လာကြည့်ချင်ရင် တံခါးဖွင့်ထားပါတယ်။\n>\n> *This is one of the 14 bags we rejected today. Two grams outside tolerance.\n> The customer would never have noticed. We would have. The door is open — come and see.*\n\n**Sample draft — LinkedIn, Week 6 (Segment C)**\n\n> Capacity under load, filmed unedited: 11,000 units across a 14-hour shift,\n> 0.4% reject rate, full batch documentation issued to the buyer's auditor on\n> delivery. The footage is 9 minutes and we have not cut the slow parts out.\n> Full QC methodology and certification pack on request."},{"level":2,"h":"7. OUTREACH STRATEGY","md":"No consumer influencers. Credibility in B2B comes from three places:\n\n| Tier | Who | Deliverable | Fee band (MMK) |\n|---|---|---|---|\n| Authority | 2 industry association figures | Factory visit + honest published assessment | 1,800,000 each |\n| Practitioner | 4 procurement/logistics voices | Walkthrough reaction + Viber community post | 700,000 each |\n| Customer | 6 existing buyers | Filmed testimonial at *their* site, unscripted | Cost only |\n\nCustomer voices outperform everything else in this category and cost the least.\nThey are also the hardest to fake, which is why buyers believe them."},{"level":2,"h":"8. PAID MEDIA PLAN","md":"| Platform | Objective | Budget (MMK) | Audience | Expected |\n|---|---|---|---|---|\n| Facebook | Reach + video views | 9,000,000 | Interest: procurement, wholesale, construction; 28–55; Yangon/Mandalay | CPM 3,500–5,000 |\n| Facebook | Lead generation | 7,500,000 | Retargeting 50%+ video viewers | CPL 38,000–52,000 |\n| Viber | Community reach | 4,500,000 | Business communities, Yangon commercial | CPM 4,000–6,000 |\n| LinkedIn | Segment C reach | 5,000,000 | Sourcing/supply-chain titles, SG/TH/VN | CPC 1,200–2,400 |\n| Search | Intent capture | 2,000,000 | \"supplier Myanmar\", category terms | CPC 700–1,500 |\n| **Total** | | **28,000,000** | | |\n\nSequenced, not simultaneous: reach for 4 weeks builds the retargeting pool that\nmakes lead generation cheap from week 5. Running both from day one is the most\ncommon and most expensive mistake in this category."},{"level":2,"h":"9. ACTIVATION — OPEN FACTORY DAYS","md":"Four Open Factory Days across the campaign, 25–40 buyers each.\n\nBuyers arrive without a curated route. They walk the floor with the supervisor,\nwatch a live QC rejection, see the documentation system, and leave with a sample\nand a batch record carrying their own name on it. No presentation room, no\nslides. The factory is the pitch.\n\nPlus presence at **two trade fairs** (Myanmar Build & Décor, Manufacturing\nMyanmar) — a working demonstration bench, not a brochure counter."},{"level":2,"h":"10. DETAILED BUDGET","md":"| Line | Unit | Qty | Rate (MMK) | Total (MMK) |\n|---|---|---|---|---|\n| Content production — film crew | day | 12 | 850,000 | 10,200,000 |\n| Editing + subtitling (MM/EN) | film | 24 | 220,000 | 5,280,000 |\n| Stills + documentation photography | day | 6 | 400,000 | 2,400,000 |\n| Paid media (see §8) | — | — | — | 28,000,000 |\n| Authority + practitioner fees | — | — | — | 6,400,000 |\n| Open Factory Days | event | 4 | 1,850,000 | 7,400,000 |\n| Trade fair presence | fair | 2 | 3,200,000 | 6,400,000 |\n| English capability pack (design + translation) | pack | 1 | 2,600,000 | 2,600,000 |\n| Campaign management (16 weeks) | month | 4 | 2,400,000 | 9,600,000 |\n| **Subtotal** | | | | **78,280,000** |\n| Contingency 10% | | | | 7,828,000 |\n| **Cost base** | | | | **86,108,000** |"},{"level":2,"h":"11. TIMELINE","md":"| Weeks | Phase | Milestones |\n|---|---|---|\n| 1–2 | Foundation | Floor audit, QC baseline, crew onboarding, first shoot |\n| 3–6 | Proof build | 8 films live, reach campaign, retargeting pool built |\n| 5 | Open Factory Day 1 | 25 buyers, first enquiries |\n| 7–10 | Demand | Lead-gen campaigns switch on, LinkedIn opens, Fair 1 |\n| 9, 13 | Open Factory Days 2–3 | Cumulative 90 buyers on the floor |\n| 11–14 | Scale | Customer testimonial films, Fair 2, first delivery report |\n| 15–16 | Consolidate | Open Factory Day 4, quarter report, handover |"},{"level":2,"h":"12. KPIs & SUCCESS METRICS","md":"| Metric | Target | Source |\n|---|---|---|\n| Qualified enquiries | 120 | CRM, ZYNTH-tagged |\n| Cost per qualified lead | ≤ MMK 45,000 | Spend ÷ qualified leads |\n| Factory visits booked | 25 | Booking log |\n| Open Factory attendance | 120 cumulative | Registration |\n| Video completion (Facebook) | ≥ 32% at 30s | Meta |\n| Segment C enquiries | 15 | Email + LinkedIn |\n| Quote-to-order conversion | +6pp vs baseline | Client sales data |\n\nBaseline must be captured in week 1. Without it, none of these numbers mean\nanything at the end — and we will not claim a lift we cannot evidence."},{"level":2,"h":"13. ROI PROJECTION","md":"Average first order in this category: **MMK 18,000,000**. Repeat rate year one: 55%.\n\n| Scenario | Qualified leads | Close rate | New orders | Year-1 revenue (MMK) | Return on 96M |\n|---|---|---|---|---|---|\n| Conservative | 90 | 8% | 7 | 195,000,000 | 2.0× |\n| Base | 120 | 12% | 14 | 391,000,000 | 4.1× |\n| Upside | 150 | 16% | 24 | 670,000,000 | 7.0× |\n\nConservative assumes no Segment C conversion at all and half the expected\nfactory visits. Even there the campaign returns twice its cost inside a year."},{"level":2,"h":"14. RISK & MITIGATION","md":"| Risk | Likelihood | Impact | Mitigation | Owner |\n|---|---|---|---|---|\n| Factory not ready to be filmed honestly | Medium | High | Week-1 floor audit; fix or postpone. We will not stage a clean floor. | ZYNTH + client MD |\n| A published delivery miss damages confidence | Medium | Medium | Publish the miss *with* the correction. Buyers forgive the miss and remember the honesty. | ZYNTH |\n| Competitor copies the open-factory idea | Low | Low | They must open a floor they are confident in. First mover holds the position. | — |\n| Lead volume without lead quality | Medium | High | Qualification criteria agreed week 1; CPL reported against *qualified* only | ZYNTH |\n| Staff reluctant to appear on camera | Medium | Medium | Opt-in, paid appearance fee, approval before publication | ZYNTH |"},{"level":2,"h":"15. ZYNTH FEE & PROFIT MODEL","md":"| Line | MMK |\n|---|---|\n| Cost base (incl. contingency) | 86,108,000 |\n| **Client investment at 40% margin** | **143,513,000** |\n| ZYNTH gross margin | 57,405,000 (40.0%) |\n\nClears the 35% floor and sits on the 40% target. Payment: **50% deposit on\nsignature**, 25% at week 8, 25% on final report. Market FX applies. Vendor lines\nare RFQ-based and reconciled at actuals — any underspend returns to the client.\n\nIf the client's ceiling is lower, the honest reduction is **one Open Factory Day\nand one trade fair** (−MMK 10,600,000 cost base → 125,800,000 investment). We\nwill not hold the price by cutting the film days, because the films are the\ncampaign."},{"level":2,"h":"16. WHY ZYNTH","md":"We are an AI-run agency, which in this category means one specific thing: we can\nproduce and publish evidence at a volume a traditional agency prices out of\nreach. Twenty-four films in sixteen weeks is not a normal retainer — it is\nnormal for us.\n\nWhat we have actually produced, and can show: a 20-section fintech launch\nproposal with full audience segmentation and scenario modelling; a premium event\nproposal with a complete vendor and risk register; a spec product film built to\ncommercial sound-design standards; eight 3D stage and exhibition concepts.\n\nWhat we do not claim: manufacturing case studies. This would be our first in the\nsector, and we would rather say so than invent one. What we bring is the method\nand the production capacity — the floor is the client's, and it is the proof.\n\n---\n\n*ZYNTH — The Intelligence of Creativity · zynth.asia*\n*Figures indicative, vendor lines subject to RFQ. Market FX. 50% deposit on signature.*"}],"full":true,"words":2464,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Built-to-be-Trusted-Myanmar-Manufacturing-Sector-Campaign.docx","docx_kb":44.3},{"id":"Data-That-Moves-You-Youth-Telecom-Campaign","title":"Data That Moves You — Youth Telecom Campaign","file":"vault/ZYNTH-OS/Proposal-Library/Data-That-Moves-You-Youth-Telecom-Campaign.md","sector":"Telecom & Technology","market":"","type":"Campaign","idea":"A 6-week social-first campaign built on a single insight: youth don't buy data, they buy the moments data unlocks. UGC creators + a challenge mechanic.","deliverables":["Content pillars + calendar","8–12 reels/mo","Creator partnerships (tiered)","Meta/TikTok paid","Weekly performance report"],"kpis":"CPM & reach vs benchmark · challenge entries · SIM/plan activations","investment":"MMK 25–45M/mo (~S$7–13k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"Performance-creative testing framework.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":153,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Data-That-Moves-You-Youth-Telecom-Campaign.docx","docx_kb":36.4},{"id":"Dry-Fry-Hear-The-Crunch-F-B-Launch","title":"Dry Fry — Hear the Crunch","file":"vault/ZYNTH-OS/Proposal-Library/Dry-Fry-Hear-The-Crunch-F-B-Launch.md","sector":"F&B / QSR (fried chicken)","market":"Myanmar (Yangon)","type":"Brand launch — campaign + opening event","idea":"In a market of soft, greasy, same-tasting fried chicken, Dry Fry owns the one thing you can actually hear — the crunch. Dry-fried, boldly spiced, never greasy. **Hear the Crunch.**","deliverables":["Hero \"Crunch\" film (sound-first / ASMR)","#HearTheCrunch UGC challenge","\"First Crunch\" opening event + crunch wall","6 food KOLs incl. 1 top-tier","Delivery \"crunch-box\" + promo · 6-week paid"],"kpis":"2,500–4,000 opening-week covers · 3,000–5,000 delivery orders (month 1) · 25–35% repeat-visit · cost/trial ≤ MMK 1,200","investment":"Essential 24M · **Signature 46M (recommended)** · Flagship 82M MMK · 50% deposit · market FX.","pricing_model":"tiers","tiers":[{"name":"Essential","price":"24M MMK","rec":false},{"name":"Signature","price":"46M MMK","rec":true},{"name":"Flagship","price":"82M MMK","rec":false}],"edge":"Owns a sensory territory (crunch/sound) no competitor claims — the food itself becomes the ad, built for sound-first platforms.","url":"https://claude.ai/code/artifact/54b020b5-124a-46d9-8d11-f00e87c2d397","doc_url":"","drive_url":"","sections":[],"full":false,"words":182,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Dry-Fry-Hear-the-Crunch.docx","docx_kb":36.6},{"id":"Find-Where-You-Belong-Property-Launch","title":"Find Where You Belong — Property Launch","file":"vault/ZYNTH-OS/Proposal-Library/Find-Where-You-Belong-Property-Launch.md","sector":"Real Estate & Property","market":"","type":"Event","idea":"A premium launch that sells a life, not a floorplan: cinematic CGI reveal, scale model moment, private investor lounge.","deliverables":["Launch event","CGI film + walkthrough","Scale-model reveal","Investor collateral","Lead-capture system"],"kpis":"Qualified leads · bookings on the night · cost-per-lead","investment":"MMK 90–180M (~S$26–51k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"3D/CGI edge rare in the MM/SG SME market.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":147,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Find-Where-You-Belong-Property-Launch.docx","docx_kb":36.4},{"id":"In-Good-Hands-Healthcare-Trust-Series","title":"In Good Hands — Healthcare Trust Series","file":"vault/ZYNTH-OS/Proposal-Library/In-Good-Hands-Healthcare-Trust-Series.md","sector":"Healthcare & Pharma","market":"","type":"Campaign","idea":"A trust-building content series: real doctors, real patient stories, calm authority — turning a hospital into the name families recommend.","deliverables":["Content strategy","6–8 patient/doctor films","Health-education carousels","Community management","Monthly report"],"kpis":"Reach · sentiment · enquiry/appointment lift","investment":"MMK 20–40M/mo (~S$6–11k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"Cinematic trust films, not stock.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":136,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_In-Good-Hands-Healthcare-Trust-Series.docx","docx_kb":36.4},{"id":"KPay-Thadingyut-Shwe-Yaung-Lin-Light-of-Gratitude","title":"KPAY THADINGYUT SHWE-YAUNG-LIN: THE LIGHT OF GRATITUDE","file":"vault/ZYNTH-OS/Proposal-Library/KPay-Thadingyut-Shwe-Yaung-Lin-Light-of-Gratitude.md","sector":"Banking & Finance / Fintech (mobile wallet)","market":"Myanmar (Yangon, Mandalay)","type":"Festival campaign — integrated digital","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. CAMPAIGN OVERVIEW","md":"The KPay Thadingyut Shwe-Yaung-Lin (Golden Light) campaign is a high-impact, integrated digital marketing initiative designed to position KPay as the primary facilitator of tradition, gratitude, and commerce during Myanmar’s most significant festival of lights. As the nation transitions into the 2026 festive season, this campaign leverages the deep-rooted cultural practice of \"Kan-Taw\" (paying respects to elders) and the peak consumer spending period to drive aggressive user acquisition and transaction growth.\n\n| Category | Details |\n|---|---|\n| Client | KPay (KBZPay) |\n| Campaign Name | KPay Thadingyut Shwe-Yaung-Lin (Golden Light) |\n| Campaign Type | Integrated Digital (Social + Influencer + Paid + Activation) |\n| Occasion | Thadingyut Festival 2026 (Festival of Lights) |\n| Primary Objective | 50,000 New Premium Sign-ups |\n| Secondary Objective | +30% Transaction Volume (P2P & Merchant) |\n| Market | Myanmar (Yangon Primary, Mandalay Secondary) |\n| Total Budget | 80,000,000 MMK (~$18,200 USD) |\n| Duration | 6 Weeks (Oct 12 – Nov 22, 2026) |\n| Industry | Fintech / Mobile Payments |"},{"level":2,"h":"2. TARGET AUDIENCE PROFILE","md":"To achieve the ambitious target of 50,000 premium sign-ups, the campaign focuses on three high-value segments that drive the digital economy in Myanmar."},{"level":2,"h":"Segment A: The Urban \"Gratitude\" Gen Z & Millennials","md":"Demographics: Age 22-35; Male/Female; Single or newly married; Income 800,000+ MMK/month.\nLocation: Yangon (Hlaing, Bahan, Kamayut), Mandalay.\nPsychographics: Value modern convenience but are deeply traditional. They feel a strong obligation to \"Kan-Taw\" their parents and teachers but are often time-poor or physically distant from them. They aspire to be seen as successful and generous.\nBehaviors: Heavy TikTok and Facebook users. Early adopters of social commerce. Use mobile wallets for food delivery, mobile top-ups, and streaming subscriptions.\nPain Points: The hassle of finding clean, new banknotes for Thadingyut gifting; the risk of carrying large amounts of cash during festivals; the \"guilt\" of not being able to visit home.\nMedia Consumption: TikTok (evening peaks 8 PM - 11 PM), Facebook (all-day browsing), Telegram (news/community groups)."},{"level":2,"h":"Segment B: The \"Thriving\" SME Owners","md":"Demographics: Age 28-45; Business owners (fashion, electronics, food, beauty); Income 2,000,000+ MMK/month.\nLocation: Major commercial hubs in Yangon (Downtown, Mingalar Taung Nyunt) and Mandalay.\nPsychographics: Focused on efficiency, business growth, and financial security. They want to capitalize on the Thadingyut spending surge and reduce operational friction.\nBehaviors: Use Facebook for business promotion. They prefer digital payments to avoid the security risks of cash handling and the chronic difficulty of getting small change in Myanmar.\nPain Points: High transaction fees on other platforms; lack of integrated marketing support; slow settlement times.\nMedia Consumption: Facebook Business Suite, Viber communities, local business news portals (e.g., Myanmar Business Today)."},{"level":2,"h":"Segment C: The \"Modern Elders\" (Premium Referrals)","md":"Demographics: Age 50+; Parents of Segment A; High net worth or retired professionals.\nLocation: Urban residential areas (Golden Valley, North Dagon).\nPsychographics: Increasingly tech-curious but need trust and security. They enjoy receiving gifts and \"pocket money\" from their children and want to feel \"included\" in the digital age.\nBehaviors: Use Facebook to stay connected with family. Watch long-form video content (Facebook Watch). Use Viber for messaging.\nPain Points: Fear of digital fraud; complex UI/UX in financial apps; dependence on children for tech support.\nMedia Consumption: Facebook (Morning 7 AM - 9 AM), Viber, traditional TV (occasionally)."},{"level":2,"h":"3. COMPETITIVE LANDSCAPE","md":"The Myanmar mobile payment market in 2026 is a duopoly under pressure, with KPay and WavePay leading, followed by niche bank-led wallets.\n\n| Competitor | Thadingyut Strategy | Gaps & Opportunities for KPay |\n|---|---|---|\n| WavePay | Heavy focus on rural agent networks and cash-out promotions. Usually runs \"Spin the Wheel\" games with low-value prizes. | Gap: Their UI feels \"utility-heavy\" and lacks emotional resonance. KPay Opportunity: Focus on the \"premium\" and \"lifestyle\" aspects of gifting. |\n| OnePay | Partnerships with high-end malls (Junction City, City Mall) for flat cashback. | Gap: Limited reach outside Tier-1 retail. KPay Opportunity: Dominate the \"Digital Kan-Taw\" P2P space which is higher in volume. |\n| AYA Pay / CB Pay | Focus on interest rates and fixed deposit integrations. | Gap: Perceived as \"too corporate\" and slow for the festive mood. KPay Opportunity: Be the \"fast, social, and celebratory\" wallet. |\n| MPT Money | Bundled data and top-up offers for MPT users. | Gap: Lack of a strong merchant ecosystem and social features. KPay Opportunity: Leverage the KBZ ecosystem (merchants + banking trust). |\n\nStrategic Advantage: KPay’s integration with the KBZ Bank ecosystem provides a \"Premium\" perception that WavePay lacks. This campaign will exploit that by positioning KPay as the only way to send \"Golden Blessings\" (Shwe-Yaung-Su) that carry more prestige than simple cash."},{"level":2,"h":"The Big Idea: \"Shwe-Yaung-Lin\" (The Golden Light of Gratitude)","md":"Thadingyut is the \"Festival of Lights,\" symbolizing the Buddha's descent from heaven. Traditionally, it is a time of illumination and showing gratitude. Our strategy is to digitize the light. We will position every KPay transaction—whether a gift to a parent or a payment to a merchant—as a \"spark of light\" that contributes to a brighter, more prosperous Myanmar."},{"level":2,"h":"Brand Positioning","md":"KPay is the \"Enabler of Modern Traditions.\" We aren't replacing the traditional Thadingyut; we are making it more beautiful, secure, and rewarding through technology. We are the bridge between the physical candle and the digital gift."},{"level":2,"h":"Key Messages","md":"\"Send Gratitude Instantly:\" No need for new banknotes. Send \"Digital Kan-Taw\" with customized Thadingyut \"Golden Envelopes\" in the KPay app.\n\"Illuminate Your Savings:\" Get exclusive 10-20% cashback when you shop at KPay partner merchants for Thadingyut gifts.\n\"The Gift that Gives Back:\" Every new premium sign-up during the festival enters a draw to win \"Shwe-Yaung-Su\" (Golden Prizes) totaling 20,000,000 MMK.\n\"Empowering the Spark:\" Supporting local SMEs by driving traffic to their stores through the KPay merchant network."},{"level":2,"h":"Tone of Voice","md":"Warm & Respectful: For the \"Kan-Taw\" and emotional aspects.\nVibrant & Innovative: For the tech features and TikTok challenges.\nHigh-Energy: For the lucky draws and merchant promotions.\nLanguage: Modern Burmese (colloquial for social) and Professional Burmese (for SME/Business)."},{"level":2,"h":"Campaign Hashtags","md":"Primary: #KPayShweThadingyut\nSecondary: #DigitalKanTaw #KPayLightUp2026 #ShweYaungLin"},{"level":2,"h":"5. CHANNEL STRATEGY","md":"To maximize the 80,000,000 MMK budget, we will utilize a \"Full-Funnel\" approach, concentrating 70% of the spend on Facebook and TikTok, which are the dominant platforms in Myanmar.\n\n| Channel | Role in Funnel | Budget % | Budget (MMK) | Expected Reach |\n|---|---|---|---|---|\n| Facebook | Awareness & Community | 35% | 28,000,000 | 4,500,000+ |\n| TikTok | Virality & Engagement | 30% | 24,000,000 | 6,000,000+ |\n| Influencers | Trust & Conversion | 20% | 16,000,000 | 2,000,000+ |\n| Viber/Telegram | Direct Retargeting | 5% | 4,000,000 | 500,000+ |\n| On-Ground/POS | Conversion at Merchant | 10% | 8,000,000 | 1,000,000+ |\n\nChannel Roles:\nFacebook: The \"Community Hub.\" Used for long-form storytelling videos, detailed merchant promotion carousels, and SME-focused educational content. We will utilize Facebook Groups to foster a sense of community.\nTikTok: The \"Entertainment Engine.\" Focus on the #KPayLightUp Challenge, trending sounds, and quick \"How-to-Kan-Taw\" skits. This is the primary channel for the 50,000 sign-up goal.\nViber: In Myanmar, Viber is the \"Business Communication Tool.\" We will use Viber Ads and Community Blasts to reach SME owners and older demographics with direct CTAs.\nOn-Ground: The \"Last Mile.\" Physical QR stands and branding at 1,000+ merchants to convert foot traffic into KPay transactions."},{"level":2,"h":"Content Pillars","md":"The \"Modern Kan-Taw\" (Emotional): Focusing on the beauty of showing gratitude to elders through digital means.\nThe \"Merchant Spark\" (Functional): Highlighting the ease of shopping and the massive rewards at KPay partner stores.\nThe \"Golden Prize\" (Incentive): Constant hype around the 50,000 sign-up goal and the 20,000,000 MMK prize pool.\nThe \"SME Spotlight\" (Business): Showcasing the success of local businesses using KPay."},{"level":2,"h":"4-WEEK DETAILED CONTENT CALENDAR","md":"| Week | Platform | Content Type | Topic/Caption | CTA | Visual Description |\n|---|---|---|---|---|---|\n| Week 1 | FB/TikTok | Hero Video | \"The Light That Never Fades\" - A story of a son in Yangon sending Kan-Taw to his mother in a remote village. | Download KPay | Cinematic 60s video. Warm lighting, emotional music. |\n| Week 1 | Facebook | Carousel | \"Top 10 Thadingyut Gifts You Can Buy with KPay Cashback.\" | Shop Now | 10 slides featuring electronics, fashion, and food hampers. |\n| Week 1 | TikTok | Challenge | Launch #KPayLightUp Challenge with a custom AR Filter that lights up candles as you smile. | Join Now | Influencer \"A\" performing the dance with the AR filter. |\n| Week 2 | FB/Viber | Infographic | \"Why Cash is Old School: 5 Reasons to go Digital this Thadingyut.\" | Upgrade to Premium | Clean, gold-themed graphic comparing cash vs KPay. |\n| Week 2 | TikTok | Reel | \"The SME Hustle: How Ko Tun grew his shop by 40% with KPay QR.\" | Register Merchant | Fast-paced, interview-style edit with a local shop owner. |\n| Week 2 | FB/TikTok | Tutorial | \"How to send a Golden Envelope in 3 taps.\" | Try it Now | Screen recording with upbeat music and gold overlays. |\n| Week 3 | All | Live Session | \"Thadingyut Eve Grand Lucky Draw\" - Announcing the first 5 winners of the Golden Prizes. | Sign up to Win | High-energy studio set with 2 celebrity hosts. |\n| Week 3 | FB/IG | Stories | \"Merchant of the Day\" - Spotlighting local shops with 20% cashback. | Shop at [Shop Name] | Quick, punchy videos showing products and the KPay QR code. |\n| Week 3 | All | Greeting | \"Happy Thadingyut! Light up your home and your heart.\" | Send Blessings | Stunning high-res image of Myanmar festivals with KPay branding. |\n| Week 4 | Facebook | Testimonial | \"The Joy of Giving: Stories from our KPay Winners.\" | Join the Community | Compilation of winner reactions and thank you messages. |\n| Week 4 | TikTok | Remix | \"Best of #KPayLightUp Challenge\" - Top entries mashup. | Watch More | High-energy edit of the best user-generated content. |\n| Week 4 | FB/Viber | Retention | \"The Glow Continues: Pay your bills with KPay and win more.\" | Pay Now | Focus on utility (electricity, water bills) to keep users active. |"},{"level":2,"h":"Sample Content Drafts","md":"Post Type: Emotional Hero Video (Facebook)\nBurmese Caption: သီတင်းကျွတ်မှာ လူကိုယ်တိုင် မကန်တော့နိုင်ပေမယ့် မေတ္တာတွေကတော့ အဝေးကြီးကို ရောက်နိုင်ပါတယ်။ KPay ရဲ့ \"ရွှေရောင်လင်း\" သီတင်းကျွတ်အထူးအစီအစဉ်နဲ့အတူ လူကြီးမိဘတွေကို ဒစ်ဂျစ်တယ်ကန်တော့ဆုတွေ ပို့သလိုက်ပါ။ KPay နဲ့ ကန်တော့တိုင်း သင်ရော၊ လက်ခံသူပါ ရွှေဆုတွေ ကံထူးနိုင်မယ့် အခွင့်အရေး! 🏮✨\nEnglish Translation: Even if you can't pay respects in person this Thadingyut, your love can travel any distance. Send \"Digital Kan-Taw\" blessings to your elders with KPay’s \"Golden Light\" special program. Every time you send a gift via KPay, both you and the recipient stand a chance to win Golden Prizes! 🏮✨\nVisual: A split screen showing a busy young professional in Yangon and an elderly mother in a rural town. He taps his phone, and a \"Golden Envelope\" animation flies across the screen, appearing on her phone. Her face lights up with a smile as bright as a Thadingyut candle.\nPost Type: Merchant Promotion (TikTok)\nBurmese Caption: သီတင်းကျွတ်လက်ဆောင်တွေ ဝယ်ဖို့ စဉ်းစားနေလား? 🎁 KPay နဲ့ပေးရင် ၂၀% အထိ Cashback ပြန်ရမယ့်အပြင် ရွှေဆုတွေလည်း ကံစမ်းနိုင်ဦးမှာနော်! အခုပဲ နီးစပ်ရာ KPay Partner ဆိုင်တွေမှာ ဈေးဝယ်လိုက်ပါ။ 💸✨\nEnglish Translation: Thinking about buying Thadingyut gifts? 🎁 Pay with KPay to get up to 20% Cashback and a chance to win Golden Prizes! Shop now at your nearest KPay Partner stores. 💸✨\nVisual: Fast cuts of a trendy young woman shopping for clothes and gadgets. She scans the KPay QR code, and a \"Cashback\" coin animation pops up on the screen."},{"level":2,"h":"7. INFLUENCER/KOL STRATEGY","md":"We will move away from \"Mega-Celebrities\" and focus on \"Relatable Tiers\" to drive actual app downloads and premium upgrades."},{"level":2,"h":"Influencer Breakdown","md":"| Tier | Count | Profile Type | Role | Budget (MMK) | Deliverables |\n|---|---|---|---|---|---|\n| Macro | 3 | Lifestyle/Family Icons | Brand Credibility & Hero Content | 6,000,000 | 1 Hero Video, 2 FB Posts, 3 IG Stories |\n| Mid-Tier | 10 | Tech Reviewers / Foodies | Functional Demos & Merchant Visits | 7,000,000 | 1 TikTok Review, 2 FB Posts, 5 IG Stories |\n| Micro | 30 | University Students / SME Owners | Hyper-local reach & Challenge participation | 3,000,000 | 2 TikTok Challenges, 3 FB/IG Stories |"},{"level":2,"h":"The #KPayLightUp Hashtag Challenge (TikTok)","md":"Concept: A branded AR filter that places a traditional Myanmar \"Ozi\" (drum) and candles in the frame. Users must perform a 15-second \"Gratitude Dance.\"\nIncentive: The top 50 most creative videos win 200,000 MMK KPay credit each.\nInfluencer Lead: We will hire 5 top TikTok dancers to seed the challenge in the first 48 hours."},{"level":2,"h":"Collaboration Format","md":"Unboxing Gratitude: Influencers receive a physical \"KPay Golden Box\" containing traditional treats and a KPay QR code with a pre-loaded gift. They film their reaction.\nThe Merchant Crawl: Mid-tier influencers visit 3 partner merchants in a single day, showing how they save money using KPay cashback.\nElders React: Micro-influencers film their parents' reactions to receiving a \"Digital Kan-Taw\" for the first time."},{"level":2,"h":"8. PAID MEDIA PLAN","md":"The paid media strategy is optimized for the Myanmar market, where Facebook CPAs are rising, and TikTok offers the best \"Attention-to-Cost\" ratio."},{"level":2,"h":"Platform Breakdown","md":"| Platform | Objective | Daily Budget | Duration | Targeting | Expected Impressions | Expected Clicks | Expected CPA (Sign-up) |\n|---|---|---|---|---|---|---|---|\n| Facebook Ads | App Installs / Conversion | 600,000 MMK | 42 Days | Interest: Banking, Shopping, Festival; Age 22-45; Yangon/Mandalay | 12,000,000 | 240,000 | 800 MMK |\n| TikTok Ads | Reach / Video Views | 400,000 MMK | 30 Days | Interest: Entertainment, Tech, Fashion; Age 18-35; Nationwide | 18,000,000 | 360,000 | 500 MMK |\n| Viber Ads | Direct Traffic | 150,000 MMK | 20 Days | SME Owners, Business Groups, Existing KBZ Customers | 2,000,000 | 40,000 | 1,200 MMK |\n\nTargeting Strategy:\nLookalike Audiences: We will upload a hashed list of existing \"High-Volume\" KPay users to create a 1% Lookalike Audience on Facebook.\nRetargeting: Users who watched >50% of the \"Hero Video\" will be retargeted with \"Merchant Cashback\" carousel ads.\nDay-parting: Ads will be boosted between 7:00 PM and 10:30 PM, which is the peak \"Thadingyut Browsing\" time in Myanmar.\nDevice Targeting: Focus on mid-to-high-end Android devices and iPhones to ensure users have the capacity to install the app."},{"level":2,"h":"9. ACTIVATION / ON-GROUND COMPONENT","md":"While the campaign is digital-first, physical presence in Yangon and Mandalay is crucial for \"Premium\" brand perception."},{"level":2,"h":"\"The KPay Golden Pavilion\" (Pop-up Experience)","md":"Locations: Junction City (Yangon) and Ocean Supercenter (Mandalay).\nActivity: A 3-day immersive \"Light Tunnel.\" Users who show their KPay Premium status get to enter the tunnel, take a professional \"Golden Portrait\" (optimized for Instagram/TikTok), and receive a physical \"Thadingyut Blessing Card\" with a QR code for a random cashback (1,000 - 50,000 MMK).\nDigital Tie-in: Users must post their portrait with #KPayShweThadingyut to unlock the cashback QR code."},{"level":2,"h":"Merchant Partnership Strategy: \"The 1,000 Spark Network\"","md":"We will partner with 1,000 SME merchants (Cafes, Fashion Boutiques, Flower Shops).\nEach merchant gets a \"KPay Thadingyut Kit\" (Gold-branded QR stands, bunting, and staff t-shirts).\nCustomer Incentive: 10% instant discount (capped at 5,000 MMK) for KPay payments.\nMerchant Incentive: The top 10 merchants with the highest KPay transaction growth win a \"Business Growth Package\" from ZYNTH (Digital Marketing Audit + 1 Month of Content Management)."},{"level":2,"h":"10. DETAILED BUDGET","md":"The 80,000,000 MMK budget is allocated to ensure a balance between high-quality production and aggressive media reach.\n\n| Category | Item | Description | Cost (MMK) | Cost (USD) | % of Total |\n|---|---|---|---|---|---|\n| Content Production | Hero Video & Ad Creative | 60s Cinematic Video + 20 Static Assets + 5 Reels | 12,000,000 | $2,727 | 15% |\n| Paid Media | Facebook/TikTok/Viber | 6 Weeks of aggressive ad spend | 38,000,000 | $8,636 | 47.5% |\n| Influencer Marketing | 43 Influencers | Tiers: Macro, Mid, Micro (including Challenge seeding) | 16,000,000 | $3,636 | 20% |\n| Activation | Pop-ups & Merchant Kits | Booth construction, printing, staff, and event logistics | 8,000,000 | $1,818 | 10% |\n| Creative & Design | Campaign Visual Identity | UI/UX for in-app banners, AR filter design | 4,000,000 | $909 | 5% |\n| Contingency | Emergency Fund | For rapid-response content or ad-hoc boosts | 2,000,000 | $455 | 2.5% |\n| GRAND TOTAL |  |  | 80,000,000 | $18,181 | 100% |\n\nNote: Exchange rate calculated at 1 USD = 4,400 MMK (Market Rate estimate for 2026)."},{"level":2,"h":"11. TIMELINE (6-WEEK EXECUTION)","md":"The campaign follows a \"Spark - Flame - Glow\" structure to build momentum leading up to the Full Moon of Thadingyut.\n\n| Week | Phase | Key Activities | Deliverables | Responsible |\n|---|---|---|---|---|\n| Week 1 (Oct 12-18) | The Spark (Pre-Festival) | Teaser campaign, Hero Video launch, #KPayLightUp Challenge launch. | Teaser assets, Hero Video, TikTok Filter. | ZYNTH Creative |\n| Week 2 (Oct 19-25) | The Flame (Build-up) | Influencer content rollout, Merchant partnership announcements, Pop-up setup. | KOL posts, Merchant kits, Booth construction. | ZYNTH Media |\n| Week 3 (Oct 26-Nov 1) | The Radiance (Festival Peak) | Thadingyut Full Moon (Oct 27), 24/7 Ad monitoring, Live Prize Draws. | Live Stream, Real-time engagement. | ZYNTH Ops |\n| Week 4 (Nov 2-8) | The Glow (Post-Festival) | \"Last Chance\" cashback offers, Winner testimonials, Gratitude content. | Testimonial videos, \"Thank You\" posts. | ZYNTH Content |\n| Week 5 (Nov 9-15) | Retention | Re-targeting users for everyday utility (bills, top-ups), SME success stories. | Case study assets, Utility ads. | ZYNTH Strategy |\n| Week 6 (Nov 16-22) | Analysis | Final data collection, ROI calculation, Post-mortem report for Client. | Final Campaign Report. | ZYNTH Data |"},{"level":2,"h":"12. KPIs & SUCCESS METRICS","md":"We measure success not just in \"Likes,\" but in \"Livelihoods\" and \"Logs\" (Sign-ups).\n\n| Metric | Target | Measurement Tool |\n|---|---|---|\n| Total Reach | 12,000,000 Unique Users | FB Ads Manager / TikTok Ads Manager |\n| Total Impressions | 35,000,000 | FB Ads Manager / TikTok Ads Manager |\n| Average Engagement Rate | 4.5% | Social Listening Tools (Brandwatch) |\n| App Downloads | 120,000 | AppsFlyer / Google Play Console |\n| New Premium Sign-ups | 50,000 | KPay Internal Dashboard |\n| Transaction Volume Growth | +30% vs. Sept 2026 | KPay Internal Dashboard |\n| Cost Per Acquisition (CPA) | < 1,600 MMK | Total Spend / New Sign-ups |\n| #KPayLightUp Challenge | 5,000+ User Generated Videos | TikTok Hashtag Insights |"},{"level":2,"h":"13. ROI PROJECTION","md":"Investing 80,000,000 MMK is a strategic move to capture the lifetime value (LTV) of 50,000 premium users."},{"level":2,"h":"Revenue Model (Projections)","md":"New User LTV (1 Year): Estimated at 25,000 MMK (from transaction fees, cross-selling loans/insurance).\nTotal Projected Value from New Users: 50,000 users x 25,000 MMK = 1,250,000,000 MMK.\nShort-term Transaction Fee Revenue: A 30% surge in Thadingyut volume (est. 100 Billion MMK total volume) at 0.5% net fee = 500,000,000 MMK."},{"level":2,"h":"Scenario Analysis","md":"| Scenario | New Sign-ups | Volume Growth | Estimated ROI (1 Year) |\n|---|---|---|---|\n| Optimistic | 75,000 | 45% | 2,100,000,000 MMK (26x) |\n| Realistic | 50,000 | 30% | 1,450,000,000 MMK (18x) |\n| Conservative | 30,000 | 15% | 850,000,000 MMK (10x) |\n\nBreak-even Analysis: The campaign breaks even if it acquires just 3,200 premium users who remain active for 12 months."},{"level":2,"h":"14. RISK & MITIGATION","md":"| Risk | Impact | Mitigation Strategy |\n|---|---|---|\n| Ad Fatigue | High | Refresh creative assets every 10 days; use 5 different \"Hero\" hooks. |\n| Competitor Under-cutting | High | Maintain \"Premium\" positioning; don't enter a \"Cashback War.\" Focus on emotion. |\n| Technical App Downtime | Critical | Pre-campaign load testing with KBZ IT team; 24/7 dev standby during Oct 25-28. |\n| Low Influencer Performance | Medium | Performance-based contracts (50% base + 50% based on referral code usage). |\n| Political Sensitivity | High | Strict content guidelines; all content vetted by local cultural advisors. |\n| Ad Account Bans (FB/TikTok) | Medium | Maintain 3 \"Backup\" ad accounts and pre-verify all domains. |\n| Internet Connectivity Issues | Medium | Optimize content for \"Low Data\" (static versions of video ads). |\n| Fraudulent Sign-ups | High | Implement multi-factor KYC verification for \"Premium\" status eligibility. |\n| Merchant Onboarding Delay | Medium | Deploy a dedicated \"Strike Team\" to assist merchants with QR setup 2 weeks prior. |\n| Negative PR/Scams | High | 24/7 social monitoring and a \"Security Awareness\" sub-campaign to warn against fake prize scams. |"},{"level":2,"h":"15. ZYNTH FEE & PROFIT MODEL","md":"At ZYNTH, we operate on a \"Performance + Management\" model. Our fee is structured to align our success with KPay’s growth.\n\n| Item | Amount (MMK) | Description |\n|---|---|---|\n| Execution Budget | 80,000,000 | Media spend, production, influencers, and activation costs. |\n| ZYNTH Management Fee (18%) | 14,400,000 | Strategy, account management, and reporting. |\n| Total Client Investment | 94,400,000 | (~$21,450 USD) |\n\nWhat’s Included in the Fee:\nDedicated 5-person account team (Strategy, Creative, Media, Social, Data).\nWeekly performance optimization reports.\nFull intellectual property rights to all creative assets produced.\nAccess to ZYNTH’s proprietary \"Social Listening\" dashboard for the duration of the campaign.\nZYNTH Profit:\nGross Profit: 14,400,000 MMK.\nNet Profit (after overhead): ~8,500,000 MMK ($1,930 USD)."},{"level":2,"h":"16. WHY ZYNTH FOR THIS CAMPAIGN?","md":"Choosing ZYNTH means choosing an agency that understands the pulse of Myanmar and the speed of Fintech.\nHyper-Local Expertise: Our team is composed of \"Digital Natives\" who live and breathe Myanmar’s social media culture. We don't just translate campaigns; we build them from the soil up.\nData-Driven Creativity: We don't guess what works. We use real-time data to pivot our creative strategy every 48 hours, ensuring every Kyat of your 80,000,000 MMK budget is working hard.\nThe \"ZYNTH Second Brain\": Our internal knowledge graph of Myanmar influencer performance and consumer behavior allows us to predict campaign outcomes with 85%+ accuracy.\nExecution Guarantee: We guarantee the delivery of all 50,000 premium sign-ups. If we fall short of the \"Conservative\" scenario targets, we will continue management at no additional fee until the targets are met.\nFintech Specialists: We have a proven track record of scaling digital wallets in emerging markets, understanding the balance between security and user friction.\n\"Let's light up Myanmar together this Thadingyut.\"\nPrepared by: Zane (Lead Strategist)\nAgency: ZYNTH Marketing Agency\nDate: July 20, 2026\nContact: www.zynth.asia | zane@zynth.asia"}],"full":true,"words":3876,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_KPAY-THADINGYUT-SHWE-YAUNG-LIN-THE-LIGHT-OF-GRATITUDE.docx","docx_kb":48.8},{"id":"Pour-Culture-Beverage-Brand-Activation","title":"Pour Culture — Beverage Brand Activation","file":"vault/ZYNTH-OS/Proposal-Library/Pour-Culture-Beverage-Brand-Activation.md","sector":"FMCG & Consumer Goods","market":"","type":"Campaign","idea":"Turn a beverage into a scene: a shareable ritual + city activations + creator seeding, engineered for muted-feed stopping power.","deliverables":["Big idea + key visual","Activation kit (3 sites)","Reels + stills batch","Creator seeding","Sampling logistics"],"kpis":"Reach & engagement rate · sampling redemptions · UGC volume","investment":"MMK 30–60M (~S$9–17k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"Producer-led shoots at boutique cost.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":149,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Pour-Culture-Beverage-Brand-Activation.docx","docx_kb":36.4},{"id":"Season-of-Belonging-Mall-Festival","title":"Season of Belonging — Mall Festival","file":"vault/ZYNTH-OS/Proposal-Library/Season-of-Belonging-Mall-Festival.md","sector":"Retail & Shopping Malls","market":"","type":"Event","idea":"A tentpole seasonal festival that fills the mall: hero installation, stage programming, tenant tie-ins, and a social wall driving dwell time.","deliverables":["Festival concept + zoning","Hero installation","Stage + performances","Tenant campaign","Daily content"],"kpis":"Footfall uplift · tenant sales lift · social mentions","investment":"MMK 60–120M (~S$17–34k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"End-to-end: concept → build → content.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":145,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Season-of-Belonging-Mall-Festival.docx","docx_kb":36.4},{"id":"Shwe-Pay-The-New-Gold-Standard-Fintech-Launch","title":"Shwe Pay — The New Gold Standard","file":"vault/ZYNTH-OS/Proposal-Library/Shwe-Pay-The-New-Gold-Standard-Fintech-Launch.md","sector":"Banking & Finance / Fintech (digital wallet)","market":"Myanmar (Yangon)","type":"Integrated launch — campaign + flagship event","idea":"In a market of wallets that belong to the banks, Shwe Pay becomes the one that belongs to *you* — money that moves as fast as your ambition. **The New Gold Standard** (Shwe = gold), carried from positioning → creative → the Launch Night → the KPI line.","deliverables":["Hero brand film \"The New Gold Standard\"","#MyGoldStandard UGC challenge","\"Launch Night\" flagship event (150–200 + creators)","Gold Moves reels · 6 KOLs incl. 1 top-tier","OOH (Yangon) · university/mall roadshow · 8-week paid"],"kpis":"120k–180k installs · 45–55% first-transaction activation · CPA ≤ MMK 650 · 2,000–3,500 merchants","investment":"Essential 48M · **Signature 98M (recommended)** · Flagship 168M MMK · 50% deposit · market FX.","pricing_model":"tiers","tiers":[{"name":"Essential","price":"48M MMK","rec":false},{"name":"Signature","price":"98M MMK","rec":true},{"name":"Flagship","price":"168M MMK","rec":false}],"edge":"One idea carried the whole way through; competes on meaning, not a cashback war scale would win.","url":"https://claude.ai/code/artifact/605f316b-db71-402a-b1b0-b8f5d7a5d584","doc_url":"","drive_url":"","sections":[],"full":false,"words":204,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Shwe-Pay-The-New-Gold-Standard.docx","docx_kb":36.6},{"id":"Stay-a-While-Hospitality-Lifestyle-Campaign","title":"Stay a While — Hospitality Lifestyle Campaign","file":"vault/ZYNTH-OS/Proposal-Library/Stay-a-While-Hospitality-Lifestyle-Campaign.md","sector":"Hospitality, Hotels & Travel","market":"","type":"Campaign","idea":"Sell the feeling of arrival: a lifestyle content engine + influencer stays + a direct-booking offer that beats the OTAs.","deliverables":["Content strategy","Property film + reels","Influencer stays","Direct-booking offer","Monthly report"],"kpis":"Direct bookings · social reach · RevPAR lift on offer","investment":"MMK 20–40M/mo (~S$6–11k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"Travel storytelling that converts.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":146,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_Stay-a-While-Hospitality-Lifestyle-Campaign.docx","docx_kb":36.4},{"id":"The-Drive-Luxury-Auto-Experience","title":"The Drive — Luxury Auto Experience","file":"vault/ZYNTH-OS/Proposal-Library/The-Drive-Luxury-Auto-Experience.md","sector":"Automotive & Distribution","market":"","type":"Event","idea":"An invitation test-drive experience: cinematic reveal, curated route, lifestyle lounge — the car sold as a feeling before a spec.","deliverables":["Experience design","Reveal + staging","Curated drive route","Lifestyle lounge","Film + stills"],"kpis":"Test-drives booked · qualified leads · orders","investment":"MMK 70–140M (~S$20–40k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"Premium film + event in one house.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":139,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_The-Drive-Luxury-Auto-Experience.docx","docx_kb":36.4},{"id":"The-Hours-You-Dont-Lose-Solar-Energy-Campaign","title":"The Hours You Don't Lose — Myanmar Solar & Backup Power Campaign","file":"vault/ZYNTH-OS/Proposal-Library/The-Hours-You-Dont-Lose-Solar-Energy-Campaign.md","sector":"Energy & Renewables (solar + backup power)","market":"Myanmar (Yangon, Mandalay, Hlaing Tharyar & Shwe Pyi Thar industrial zones)","type":"Integrated B2B + B2C campaign — demand generation and category education","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. CAMPAIGN OVERVIEW","md":"Every solar company in Myanmar sells the same thing: a payback period. \"Recover\nyour investment in 3.5 years.\" Buyers have heard it from six vendors, the numbers\nnever match, and the assumption underneath — that the grid stays as it is — is\nthe one thing nobody can promise.\n\nSo the buyer stalls. Not because solar is wrong, but because the argument is\nunverifiable and everyone makes it.\n\n**This campaign changes the unit of measurement.**\n\n**Objective.** 180 qualified site surveys and 45 signed installations over 16\nweeks, at a cost per qualified survey at or below **MMK 95,000**.\n\n**Period.** 16 weeks. **Budget envelope.** MMK 68,000,000.\n\n**The bet.** Nobody can verify a payback claim in advance. Everybody can count\nthe hours their business stopped last month. Sell the hours."},{"level":3,"h":"Segment A — The Factory / Workshop Owner (highest value)","md":"**Demographics.** 35–58, owner or GM of a garment factory, cold store, printing\nworks, food processor or plastics plant. 40–600 staff. Diesel bill MMK 3–20M/month.\n**Location.** Hlaing Tharyar, Shwe Pyi Thar, Mingaladon, Mandalay industrial belt.\n**Psychographics.** Has been burned by an underspecified system that failed in\nyear two. Trusts the engineer who shows up, not the salesman who calls.\n**Behaviours.** Asks other owners first. Wants to visit a working installation of\nsimilar size before committing. Decides slowly, then buys fully.\n**Pain points.** Production stops mid-shift; diesel cost and theft; generator\nmaintenance downtime; no way to compare vendor quotes because none use the same\nassumptions; fear of being sold panels that underperform in monsoon.\n**Media.** Viber business groups, Facebook, industry associations, WhatsApp with\ntheir peers. Rarely searches; asks."},{"level":3,"h":"Segment B — The Commercial Building / Hotel Operator","md":"**Demographics.** 30–50, GM or facilities head of a hotel, clinic, mall unit,\noffice building, private school. \n**Psychographics.** Outages are a guest-experience problem before they are a cost\nproblem. A dark lobby is a review.\n**Pain points.** Generator noise and fumes near guests; fuel logistics; peak\ntariff exposure; no visibility on where power actually goes in the building.\n**Media.** Facebook, LinkedIn, industry associations, direct sales relationships."},{"level":3,"h":"Segment C — The Household Buyer (volume, brand-building)","md":"**Demographics.** 28–50, homeowner, dual-income, Yangon/Mandalay suburbs.\n**Psychographics.** Wants the fridge, the fan, the wifi and the children's study\nlamp to survive the cut. Not interested in kilowatts.\n**Pain points.** Doesn't know what size to buy; afraid of being oversold; no\ntrusted installer; unclear warranty and who services it in year three.\n**Media.** Facebook 8–10 PM, TikTok, YouTube for explainers, Viber for quotes."},{"level":2,"h":"3. COMPETITIVE LANDSCAPE","md":"| Who | What they sell | The gap we take |\n|---|---|---|\n| Established solar EPCs | Payback-period math, technical specs | Nobody can verify the claim before buying |\n| Cheap import traders | Lowest price per panel | No design, no service, no accountability at year three |\n| Generator suppliers | Familiarity, instant power | Fuel cost, noise, maintenance — the incumbent to displace |\n| Regional/Chinese EPCs | Scale and price on large tenders | No local service depth, slow response |\n\nEvery player argues on price or specification. Nobody has claimed **continuity**\n— the thing the buyer actually wants — and nobody publishes what their installed\nsystems delivered after the fact."},{"level":3,"h":"The big idea — \"The Hours You Don't Lose\" / \"မဆုံးရှုံးတဲ့ နာရီများ\"","md":"Stop selling kilowatts. Stop selling payback. **Sell the hours.**\n\nEvery proposal, every ad, every case study is denominated in one number: the\nhours this business kept running that it would otherwise have lost. A factory\ndoes not experience 12 kWp. It experiences a shift that did not stop.\n\nThe campaign's engine is the **Hours Counter** — a published, per-installation\nrunning total of outage hours covered, updated monthly from real inverter data\nacross the client's installed base. It is a number that only a company with real\ninstallations can show, and it grows every month without new advertising.\n\n**Why this and not the obvious one.** The obvious campaign is panels on a roof,\na sunrise, and \"Power Your Future\". It is interchangeable, it competes on price,\nand it forces the payback argument the buyer has stopped believing. The Hours\nCounter cannot be run by a trader with no installed base, cannot be faked, and\nconverts every past customer into ongoing proof.\n\n**Brand positioning.** The power company that counts what you keep, not what you spend.\n\n**Key messages.**\n- \"Your last month, in hours.\" — a free outage audit that quantifies the loss.\n- \"See it running.\" — visit a working installation your own size before you buy.\n- \"Same assumptions, every quote.\" — a published quoting methodology so vendors can finally be compared.\n- \"Year three is the test.\" — service record and warranty made the headline, not the footnote.\n\n**Tone of voice.** Engineer-plain. Burmese first, everyday register for Segment C,\ntechnical-professional for A and B. No sunrise language, no \"green future\"\nabstraction — this market buys reliability, not sentiment.\n\n**Hashtags.** Primary `#မဆုံးရှုံးတဲ့နာရီများ` · Secondary `#HoursYouDontLose` `#SeeItRunning`"},{"level":2,"h":"5. CHANNEL STRATEGY","md":"| Channel | Role | Share |\n|---|---|---|\n| Facebook | The proof engine — Hours Counter, installation films, owner testimony | 34% |\n| Viber | Segment A/B relationship channel — where factory owners actually talk | 18% |\n| On-ground | Site-visit programme and two industry fairs — where the deal closes | 24% |\n| TikTok / YouTube | Segment C education — \"what size do I need\" explainers | 14% |\n| LinkedIn + direct | Segment B corporate and tender pipeline | 10% |\n\nSegment A does not convert online. Digital's job is to earn the site visit; the\nsite visit closes."},{"level":2,"h":"6. CONTENT PLAN","md":"**Pillars.** The Hours 30% · The Install 30% · The Owner 25% · The Answer 15%.\n\n| Week | The Hours | The Install | The Owner | The Answer |\n|---|---|---|---|---|\n| 1–4 | Counter launches with baseline | Factory install, full build film (2) | Garment factory owner (2) | \"What size do I need\" (3) |\n| 5–8 | Month 1 hours total | Cold store install (2) | Hotel GM interview (1) | \"How to compare 3 quotes\" (2) |\n| 9–12 | Month 2 + monsoon performance | Household install, one day (2) | Year-three customer (2) | \"What breaks and who fixes it\" (2) |\n| 13–16 | Quarter total by sector | Mandalay industrial (2) | Diesel-vs-solar owner math (2) | Warranty explainer (1) |\n\n**Sample draft — Facebook, Week 5 (Segment A, Burmese first)**\n\n> ပြီးခဲ့တဲ့လမှာ ကျွန်တော်တို့ တပ်ဆင်ပေးထားတဲ့ စက်ရုံ ၄၁ ရုံအတွက်\n> **နာရီ ၂၂,၄၀၀** မီးပြတ်ချိန်ကို ဖြည့်ဆည်းပေးနိုင်ခဲ့ပါတယ်။\n> ဒါက စက်ရုံတစ်ရုံကို ပျမ်းမျှ **၅၄၆ နာရီ** — အလုပ်ရက် ၂၂ ရက်စာနီးပါးပါ။\n> သင့်စက်ရုံ ပြီးခဲ့တဲ့လမှာ ဘယ်နှနာရီ ရပ်သွားလဲ သိပါသလား?\n> အခမဲ့ စစ်ဆေးပေးပါတယ် — မေးလိုက်ရုံပါပဲ။\n>\n> *Last month our 41 installed factories covered 22,400 hours of outage — an\n> average of 546 hours each, close to 22 working days. Do you know how many\n> hours your factory stopped last month? We will audit it free.*\n\n**Sample draft — TikTok, Week 3 (Segment C, 28s)**\n\n> A woman opens her fridge during a cut. The light is on. No voiceover, no music.\n> Text: \"မီးပြတ်နေတာ ၄ နာရီရှိပြီ။\" (The power has been out 4 hours.) She closes it,\n> goes back to her daughter's homework under a working lamp. Final card:\n> \"မဆုံးရှုံးတဲ့ နာရီများ။\" No panels are shown until the last two seconds."},{"level":2,"h":"7. OUTREACH STRATEGY","md":"Technical credibility, not reach. Three tiers:\n\n| Tier | Who | Deliverable | Fee band (MMK) |\n|---|---|---|---|\n| Authority | 2 engineering-association figures | Independent site inspection + published assessment | 2,000,000 each |\n| Practitioner | 3 industrial/facilities voices | Installation walkthrough, Viber community post | 850,000 each |\n| Customer | 10 existing installations | Filmed owner testimony at their own site | Cost only |\n| Educator | 3 explainer creators (Segment C) | \"What size do I need\" series | 750,000 each |\n\nThe year-three customer is the single most persuasive asset in this category and\nthe one competitors cannot borrow — they either have those customers or they do not."},{"level":2,"h":"8. PAID MEDIA PLAN","md":"| Platform | Objective | Budget (MMK) | Audience | Expected |\n|---|---|---|---|---|\n| Facebook | Lead gen — free outage audit | 9,500,000 | Business owners/managers, manufacturing & hospitality interests, 30–58 | CPL 65,000–92,000 |\n| Facebook | Reach — Hours Counter | 5,000,000 | Yangon/Mandalay industrial + suburban homeowners | CPM 3,400–4,800 |\n| TikTok | Segment C education | 4,500,000 | 25–50, home & family interests | CPV 40–75 |\n| Viber | Segment A/B communities | 3,500,000 | Business communities, industrial zones | CPM 4,200–6,000 |\n| LinkedIn | Segment B corporate | 2,500,000 | Facilities/ops/GM titles, MM | CPC 1,300–2,500 |\n| Search | High-intent capture | 2,000,000 | \"solar factory Myanmar\", \"backup power\" terms | CPC 900–1,900 |\n| **Total** | | **27,000,000** | | |\n\nThe free outage audit is the whole lead-gen mechanic. It costs the client an\nengineer's afternoon and gives the buyer a number about their own business —\nwhich is a far better hook than a discount."},{"level":2,"h":"9. ACTIVATION — SEE IT RUNNING","md":"**Six Site Visit Days** across the campaign. Prospective buyers are taken to a\nworking installation of comparable size — a garment factory owner visits a\ngarment factory, not a showroom. They meet the owner without a salesperson in\nthe room, see the inverter data, and hear what went wrong during commissioning.\n\nPlus presence at **two industry fairs** (Myanmar Energy Expo, Manufacturing\nMyanmar) with a live load-shedding demonstration rig: the grid is cut on the\nsta

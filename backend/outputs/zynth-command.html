nd, every hour, and the stand stays lit."},{"level":2,"h":"10. DETAILED BUDGET","md":"| Line | Unit | Qty | Rate (MMK) | Total (MMK) |\n|---|---|---|---|---|\n| Content production — crew | day | 14 | 820,000 | 11,480,000 |\n| Editing + subtitling (MM/EN) | asset | 30 | 195,000 | 5,850,000 |\n| Hours Counter — data build + monthly publish | month | 4 | 1,150,000 | 4,600,000 |\n| Paid media (see §8) | — | — | — | 27,000,000 |\n| Authority, practitioner + educator fees | — | — | — | 8,800,000 |\n| Site Visit Days | day | 6 | 1,450,000 | 8,700,000 |\n| Industry fairs incl. demo rig | fair | 2 | 4,100,000 | 8,200,000 |\n| Outage-audit toolkit (forms, app, training) | pack | 1 | 3,400,000 | 3,400,000 |\n| Campaign management (16 weeks) | month | 4 | 2,450,000 | 9,800,000 |\n| **Subtotal** | | | | **87,830,000** |\n| Contingency 10% | | | | 8,783,000 |\n| **Cost base** | | | | **96,613,000** |"},{"level":2,"h":"11. TIMELINE","md":"| Weeks | Phase | Milestones |\n|---|---|---|\n| 1–3 | Baseline | Inverter data pulled, Hours Counter built, audit toolkit trained, first shoot |\n| 4 | Counter launch | Baseline hours published — the campaign's opening claim |\n| 5–8 | Proof | Install films live, reach campaign, Site Visits 1–2, Fair 1 |\n| 6 | Month 1 hours | First monthly total |\n| 9–12 | Demand | Lead gen at full weight, Site Visits 3–4, monsoon performance published |\n| 13–16 | Close | Site Visits 5–6, Fair 2, quarter total, Segment B tenders issued |\n\nMonsoon falls inside this window. We publish monsoon performance rather than\navoid it — it is the objection every buyer raises and the one nobody answers."},{"level":2,"h":"12. KPIs & SUCCESS METRICS","md":"| Metric | Target | Source |\n|---|---|---|\n| Qualified site surveys | 180 | Client CRM |\n| Cost per qualified survey | ≤ MMK 95,000 | Spend ÷ qualified surveys |\n| Signed installations | 45 | Contracts |\n| Survey-to-signature rate | ≥ 25% | CRM |\n| Site Visit Day attendance | 150 cumulative | Registration |\n| Segment C enquiries | 900 | Lead forms |\n| Hours Counter reach | 3.1M cumulative | Meta |\n| Brand association with \"reliable\" | +18 points | Survey week 1 vs 16, n=400 |\n\nBaseline survey in week 1 or the final claim is unprovable. We will not report a\nlift without it."},{"level":2,"h":"13. ROI PROJECTION","md":"Average installation value: MMK 42,000,000 (blended across segments). Gross\nmargin to client: 26%.\n\n| Scenario | Surveys | Close rate | Installs | Year-1 revenue (MMK) | Gross profit | Return on 135M |\n|---|---|---|---|---|---|---|\n| Conservative | 135 | 20% | 27 | 1,134,000,000 | 294,840,000 | 2.2× |\n| Base | 180 | 25% | 45 | 1,890,000,000 | 491,400,000 | 3.6× |\n| Upside | 220 | 30% | 66 | 2,772,000,000 | 720,720,000 | 5.3× |\n\nReturn is stated on **gross profit**, not revenue — revenue multiples in a\nhigh-ticket capital category flatter the number and mislead the decision. Even\nthe conservative case returns twice the investment inside year one, before any\nservice-contract annuity."},{"level":2,"h":"14. RISK & MITIGATION","md":"| Risk | Likelihood | Impact | Mitigation | Owner |\n|---|---|---|---|---|\n| Installed-base data too messy to publish | Medium | **High** | Week-1 data audit. If inverter data is not trustworthy, the Counter is delayed and the campaign leads on site visits instead. We will not publish an invented number. | ZYNTH + client engineering |\n| Monsoon output undercuts the promise | **High** | Medium | Publish monsoon performance honestly with the design margin explained. It is the objection anyway. | ZYNTH |\n| Sales team cannot absorb 180 surveys | Medium | High | Survey capacity agreed week 1; lead gen throttled to engineering headcount | Client sales |\n| Free audit attracts unqualified enquiries | **High** | Medium | Qualification threshold (minimum monthly bill) set week 1; CPL reported on qualified only | ZYNTH |\n| Price war triggered by competitor response | Medium | Medium | The campaign never argues price. If they cut, we publish year-three service records. | ZYNTH |\n| Grid improves, weakening urgency | Low | Medium | Message pivots to tariff exposure and diesel cost, both unaffected | ZYNTH |"},{"level":2,"h":"15. ZYNTH FEE & PROFIT MODEL","md":"| Line | MMK |\n|---|---|\n| Cost base (incl. contingency) | 96,613,000 |\n| **Client investment at 40% margin** | **161,022,000** |\n| ZYNTH gross margin | 64,409,000 (40.0%) |\n\nClears the 35% floor at the 40% target. **50% deposit on signature**, 25% at week\n8, 25% on the quarter report. Market FX. Vendor lines RFQ-based, reconciled at\nactuals; underspend returns to the client.\n\nReduced version: two fewer Site Visit Days and one fair (−MMK 7,000,000 cost base\n→ 149,355,000 investment). We will not cut the Hours Counter or the outage-audit\ntoolkit — one is the campaign's proof and the other is its lead engine."},{"level":2,"h":"16. WHY ZYNTH","md":"This campaign requires a client willing to publish real inverter data every\nmonth, including the monsoon months. Most agencies will not propose that, because\nif the data is bad the campaign gets harder. We propose it because if the data is\ngood it is unanswerable, and if the data is bad the client needs to know before\nthey spend 161 million on advertising around it.\n\nWhat we have actually produced: a 20-section fintech launch proposal with full\nsegmentation and scenario modelling; a premium launch event proposal with a\ncomplete vendor and risk register; manufacturing and logistics campaigns built on\nthe same published-evidence mechanic; a spec product film to commercial sound\nstandards; eight 3D stage and exhibition concepts.\n\nWhat we do not claim: an energy client. This would be our first in the sector,\nand we would rather say so than manufacture a case study. What we bring is the\nmethod, the production capacity for 30 assets in 16 weeks, and a measurement\ndiscipline that survives a bad month.\n\n---\n\n*ZYNTH — The Intelligence of Creativity · zynth.asia*\n*Figures indicative, vendor lines subject to RFQ. Market FX. 50% deposit on signature.*"}],"full":true,"words":2756,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_The-Hours-You-Don-t-Lose-Myanmar-Solar-Backup-Power-Campaign.docx","docx_kb":45.1},{"id":"The-New-Menu-Drop-F-B-Social-Sprint","title":"The New Menu Drop — F&B Social Sprint","file":"vault/ZYNTH-OS/Proposal-Library/The-New-Menu-Drop-F-B-Social-Sprint.md","sector":"Food & Beverage / Restaurant chains","market":"","type":"Campaign","idea":"Launch a menu like a sneaker drop: countdown, creator tastings, limited-time hooks, and reels built for the first 3 seconds.","deliverables":["Drop concept","Food-styling shoot","10–15 reels","Creator tastings","Store POS tie-in"],"kpis":"Reach · footfall on drop week · new-item mix %","investment":"MMK 15–35M (~S$4–10k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"Batch shoot → a month of content.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":154,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_The-New-Menu-Drop-F-B-Social-Sprint.docx","docx_kb":36.4},{"id":"The-Next-Tier-Premium-Fintech-Launch","title":"The Next Tier — Premium Fintech Launch","file":"vault/ZYNTH-OS/Proposal-Library/The-Next-Tier-Premium-Fintech-Launch.md","sector":"Banking & Fintech","market":"","type":"Event","idea":"An invitation-only 'initiation' night that turns a premium banking tier into a membership people want to be seen holding — LED arrival, cinematic reveal, SME success panel.","deliverables":["250-guest launch","Stage + LED + projection","QR sign-up wall","Hype film + cutdowns","Press & KOL kit"],"kpis":"≥250 premium sign-ups in 30 days · 5M+ earned impressions · ≥10 tier-1 features","investment":"MMK 110–130M (~S$31–37k) · market FX, RFQ vendors, 50% deposit","pricing_model":"range","tiers":[],"edge":"Attribution + market-FX pricing + IGNITE-standard production.","url":"","doc_url":"","drive_url":"","sections":[],"full":false,"words":171,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_The-Next-Tier-Premium-Fintech-Launch.docx","docx_kb":36.4},{"id":"The-Promise-You-Can-Track-Logistics-Campaign","title":"The Promise You Can Track — Myanmar Logistics & Delivery Campaign","file":"vault/ZYNTH-OS/Proposal-Library/The-Promise-You-Can-Track-Logistics-Campaign.md","sector":"Logistics & Supply Chain","market":"Myanmar (Yangon, Mandalay, the Yangon–Mandalay corridor)","type":"Integrated B2B + B2C campaign — trust building and demand generation","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. CAMPAIGN OVERVIEW","md":"Every logistics company in Myanmar advertises speed. None of them advertises\nhonesty. The result is a market where the customer assumes the delivery date is\noptimistic, the merchant assumes the courier will lose something eventually, and\nboth plan around a promise they do not believe.\n\nThat disbelief is expensive. Merchants hold extra stock. Customers refuse\nprepayment. Both cost the operator margin.\n\n**Objective.** 4,000 new merchant accounts and a 22-point lift in delivery-promise\ntrust over 14 weeks, at a cost per acquired merchant at or below **MMK 38,000**.\n\n**Period.** 14 weeks. **Budget envelope.** MMK 54,000,000.\n\n**The bet.** Do not promise faster. Promise *accurately*, then publish the score.\nThe operator who is honest about a two-day delivery beats the one who claims one\nday and misses."},{"level":3,"h":"Segment A — The Online Seller (primary revenue)","md":"**Demographics.** 22–38, majority women, running a Facebook or TikTok shop —\nfashion, cosmetics, phone accessories, home goods. 30–400 parcels a month.\n**Location.** Yangon (Insein, Hlaing, Thingangyun), Mandalay, secondary towns.\n**Psychographics.** Their reputation *is* the courier's performance. One lost\nparcel becomes a public comment thread under their next post.\n**Behaviours.** Compares couriers in seller Facebook groups. Switches after two\nbad experiences. Chooses on COD remittance speed as much as delivery speed.\n**Pain points.** Cash-on-delivery money released slowly; no proof of a failed\ndelivery attempt; customer blames *them*, not the courier; no way to check a\nparcel without calling.\n**Media.** Facebook seller groups (constant), TikTok 8–11 PM, Viber for support."},{"level":3,"h":"Segment B — The Receiving Customer","md":"**Demographics.** 18–40, urban and peri-urban, buys online 2–6 times a month.\n**Psychographics.** Assumes the delivery window is fiction. Plans their day\naround a call that may not come.\n**Pain points.** No real-time location; \"out for delivery\" for two days; rider\ncalls once and marks it failed; no compensation path when something breaks.\n**Media.** Facebook, TikTok, Viber. Reads reviews before paying in advance."},{"level":3,"h":"Segment C — The Corporate Shipper (highest value)","md":"**Demographics.** 30–50, operations or supply-chain manager at a distributor,\npharma company, FMCG brand or manufacturer. Contracts worth MMK 30–400M a year.\n**Psychographics.** Buys on documentation and reliability, not price. Needs to\nshow their own board a service-level record.\n**Pain points.** No SLA reporting; damage claims unresolved for months; no cold\nchain visibility; cannot audit a partner they cannot see.\n**Media.** Email, LinkedIn, industry associations, direct relationships."},{"level":2,"h":"3. COMPETITIVE LANDSCAPE","md":"| Who | What they claim | The gap |\n|---|---|---|\n| Large national couriers | \"Fastest nationwide\" | No published performance; trust is assumed, not proven |\n| App-based delivery startups | Tech-forward, young brand | Thin coverage outside Yangon; unstable rider supply |\n| Traditional freight / bus cargo | Cheap, familiar | No tracking, no accountability, no documentation |\n| In-house merchant fleets | Full control | Cannot scale; expensive per parcel |\n\nNobody publishes their on-time rate. Nobody. The first operator to do it — and\nsurvive the bad months — takes \"trustworthy\" out of the category permanently."},{"level":3,"h":"The big idea — \"The Promise You Can Track\" / \"ခြေရာခံနိုင်တဲ့ ကတိ\"","md":"Two meanings, both true. You can track the parcel — and you can track whether we\nkept our word, because we publish the number every month.\n\nThe campaign puts a **public performance board** at the centre: on-time rate,\naverage delivery time by route, COD remittance speed, damage rate, claims\nresolved. Updated monthly. Good months and bad months.\n\n**Why this and not the obvious one.** The obvious campaign is a rider smiling on\na motorbike with \"Fast · Safe · Reliable\" over it. Every competitor already runs\nit, which is exactly why nobody believes it. A published number cannot be\nclaimed by a competitor who is not willing to publish theirs — and the ones who\nare losing will not publish. The idea defends itself.\n\n**Brand positioning.** The courier that tells you the truth before you ask.\n\n**Key messages.**\n- \"We publish our score.\" — the monthly board, misses included.\n- \"Your money, the next morning.\" — COD remittance as a named, measured promise.\n- \"Two attempts, both photographed.\" — proof of attempt, ending the blame argument.\n- \"You can see it. So can your customer.\" — tracking the seller can forward.\n\n**Tone of voice.** Direct, unglamorous, accountable. Burmese written first in\neveryday register — this audience is not corporate. No superlatives; the numbers\ndo that work.\n\n**Hashtags.** Primary `#ခြေရာခံနိုင်တဲ့ကတိ` · Secondary `#PromiseYouCanTrack` `#ZeroExcuseDelivery`"},{"level":2,"h":"5. CHANNEL STRATEGY","md":"| Channel | Role | Share |\n|---|---|---|\n| Facebook | The performance board and the seller community — where merchants already compare couriers | 38% |\n| TikTok | Rider-POV storytelling and the receiving-customer audience | 22% |\n| Viber | Merchant onboarding and support; where the switch decision is made | 15% |\n| On-ground | Market and township activation — signing merchants in person | 18% |\n| LinkedIn + direct | Segment C only — SLA reporting, capability pack | 7% |"},{"level":2,"h":"6. CONTENT PLAN","md":"**Pillars.** The Score 30% · The Route 25% · The Rider 25% · The Seller 20%.\n\n| Week | The Score | The Route | The Rider | The Seller |\n|---|---|---|---|---|\n| 1–3 | Baseline board published | Corridor explainer films (2) | Rider day-in-the-life (2) | Onboarding walkthrough (2) |\n| 4–7 | Month 1 board + a missed target | Rainy-season honesty film | Night sorting hub (1) | Seller switch stories (3) |\n| 8–11 | Month 2 board | Mandalay corridor (2) | Rider training (1) | COD remittance proof (2) |\n| 12–14 | Quarter board + what we fixed | Last-mile township (2) | Rider awards (1) | 100-seller milestone |\n\n**Sample draft — Facebook, Week 4 (Burmese first)**\n\n> ဒီလ ကျွန်တော်တို့ရဲ့ အချိန်မီပို့နိုင်မှုက **၈၇%** ပါ။\n> ကျွန်တော်တို့ ကတိပေးထားတာက ၉၂% ပါ။ မမီပါဘူး။\n> အကြောင်းရင်းက မိုးရာသီမှာ မန္တလေးလမ်းကြောင်း နှေးသွားလို့ပါ။ လာမယ့်လမှာ ကားနှစ်စီး တိုးထားပါပြီ။\n> နောက်လမှာ ဒီနံပါတ်ကို ပြန်တင်ပါမယ် — ကောင်းသည်ဖြစ်စေ မကောင်းသည်ဖြစ်စေ။\n>\n> *Our on-time rate this month was 87%. We promised 92%. We missed it. The\n> Mandalay corridor slowed in the rains. We have added two vehicles. We will\n> publish this number again next month — good or bad.*\n\n**Sample draft — TikTok, Week 6 (rider POV, 22s)**\n\n> Opens on a rider's handlebar view, 6:40 AM, no music. Text on screen:\n> \"၄၂ ခု။ တစ်ရက်။\" (42 parcels. One day.) Cuts through the day — the traffic, the\n> wrong address, the customer who does not answer, the second attempt at 7 PM\n> that succeeds. Ends: \"တစ်ခုမှ မပျောက်ပါဘူး။\" (Not one lost.) No voiceover. The\n> only sound is the street."},{"level":2,"h":"7. OUTREACH STRATEGY","md":"| Tier | Who | Deliverable | Fee band (MMK) |\n|---|---|---|---|\n| Seller-community | 6 admins of large seller groups | Honest trial + published verdict | 550,000 each |\n| Creator | 4 mid-tier TikTok creators | Rider ride-along content | 900,000 each |\n| Merchant advocate | 12 existing merchants | Filmed switch story at their shop | Cost only |\n| Corporate | 2 supply-chain association figures | Hub tour + assessment for Segment C | 1,500,000 each |\n\nSeller-group admins are the highest-leverage voices in this category and are\nalmost never used properly — they will only endorse after a real trial, which is\nexactly why their endorsement moves the market."},{"level":2,"h":"8. PAID MEDIA PLAN","md":"| Platform | Objective | Budget (MMK) | Audience | Expected |\n|---|---|---|---|---|\n| Facebook | Merchant lead generation | 8,500,000 | Online sellers, small-business admins; 20–40 | CPL 30,000–42,000 |\n| Facebook | Reach — the score board | 4,000,000 | Broad urban 18–45, Yangon/Mandalay | CPM 3,200–4,600 |\n| TikTok | Video views + brand | 5,500,000 | 18–35, shopping and delivery interests | CPV 45–80 |\n| Viber | Merchant conversion | 2,500,000 | Business communities | CPM 4,000–5,800 |\n| LinkedIn | Segment C | 2,000,000 | Ops/supply-chain titles, MM + regional | CPC 1,400–2,600 |\n| **Total** | | **22,500,000** | | |\n\nSequence: the score board runs first as reach for three weeks. It is what makes\nthe lead-generation creative credible in week 4 — running them together wastes\nboth."},{"level":2,"h":"9. ACTIVATION — THE SWITCH DESK","md":"Six **Switch Desks** across 14 weeks: a two-person stand in high-density seller\nmarkets (Mingalar Zay, Yuzana Plaza, Mandalay Zaycho) where a merchant can open\nan account in eleven minutes, ship their first parcel free, and watch it move on\nthe tracking screen before they walk away.\n\nPlus one **Open Hub Night** for Segment C: corporate shippers walk the sorting\nhub at 10 PM, when it is busiest and least presentable. That is the point."},{"level":2,"h":"10. DETAILED BUDGET","md":"| Line | Unit | Qty | Rate (MMK) | Total (MMK) |\n|---|---|---|---|---|\n| Content production — crew | day | 14 | 780,000 | 10,920,000 |\n| Editing + subtitling (MM/EN) | asset | 32 | 165,000 | 5,280,000 |\n| Performance board — design + monthly build | month | 4 | 900,000 | 3,600,000 |\n| Paid media (see §8) | — | — | — | 22,500,000 |\n| Creator + community fees | — | — | — | 9,900,000 |\n| Switch Desks | desk-day | 6 | 1,250,000 | 7,500,000 |\n| Open Hub Night (Segment C) | event | 1 | 2,800,000 | 2,800,000 |\n| Merchant onboarding kit (print + samples) | 1,000 kits | 1 | 3,100,000 | 3,100,000 |\n| Campaign management (14 weeks) | month | 3.5 | 2,300,000 | 8,050,000 |\n| **Subtotal** | | | | **73,650,000** |\n| Contingency 10% | | | | 7,365,000 |\n| **Cost base** | | | | **81,015,000** |"},{"level":2,"h":"11. TIMELINE","md":"| Weeks | Phase | Milestones |\n|---|---|---|\n| 1–2 | Baseline | Measure the real on-time rate. Build the board. First shoot. |\n| 3 | Publish | Baseline score goes public — the campaign's opening move |\n| 4–7 | Trust | Score reach campaign, rider films, Switch Desks 1–2 |\n| 5 | Month 1 board | First honest miss published |\n| 8–11 | Demand | Lead generation switches on, Switch Desks 3–4, Open Hub Night |\n| 12–14 | Scale | Desks 5–6, quarter board, Segment C proposals issued |"},{"level":2,"h":"12. KPIs & SUCCESS METRICS","md":"| Metric | Target | Source |\n|---|---|---|\n| New merchant accounts | 4,000 | Operator CRM |\n| Cost per acquired merchant | ≤ MMK 38,000 | Spend ÷ activated accounts |\n| Merchant activation (first parcel in 14 days) | ≥ 62% | Operator data |\n| Delivery-promise trust lift | +22 points | Survey, week 1 vs week 14, n=400 |\n| Score-board post reach | 2.4M cumulative | Meta |\n| Segment C qualified opportunities | 12 | CRM |\n| COD remittance satisfaction | ≥ 80% | Merchant survey |\n\nThe trust survey must run in week 1. Without the baseline the 22-point claim is\nunprovable, and we will not report a lift we cannot evidence."},{"level":2,"h":"13. ROI PROJECTION","md":"Average merchant: 45 parcels/month at MMK 2,600 contribution = MMK 117,000/month.\nRetention after 12 months: 58%.\n\n| Scenario | Merchants | Active at 12mo | Year-1 contribution (MMK) | Return on 113M |\n|---|---|---|---|---|\n| Conservative | 2,600 | 1,300 | 1,825,000,000 | 16× |\n| Base | 4,000 | 2,320 | 3,257,000,000 | 29× |\n| Upside | 5,200 | 3,120 | 4,380,000,000 | 39× |\n\nLogistics returns look extreme because the unit economics are recurring — a\nmerchant acquired once ships every month. The number to watch is not\nacquisition, it is **activation and retention**, which is exactly what the honesty\nstrategy is built to protect. An acquired merchant who does not trust the\npromise churns in month two and the ROI collapses."},{"level":2,"h":"14. RISK & MITIGATION","md":"| Risk | Likelihood | Impact | Mitigation | Owner |\n|---|---|---|---|---|\n| The real on-time rate is embarrassing | **High** | High | Measure in week 1 before committing. If below 80%, fix operations first — we will not publish a number that destroys trust. | ZYNTH + client COO |\n| Competitor attacks a published miss | Medium | Medium | Publish the fix alongside the miss. The attack makes them look like they are hiding theirs. | ZYNTH |\n| Rider supply cannot absorb new volume | Medium | High | Volume ramp modelled with ops; lead-gen throttled to capacity | Client ops |\n| Rainy season degrades performance mid-campaign | **High** | Medium | Seasonal honesty built into the content plan from week 4 | ZYNTH |\n| COD remittance slips, undermining a core promise | Medium | High | Do not run the remittance message until finance confirms the SLA | Client CFO |"},{"level":2,"h":"15. ZYNTH FEE & PROFIT MODEL","md":"| Line | MMK |\n|---|---|\n| Cost base (incl. contingency) | 81,015,000 |\n| **Client investment at 40% margin** | **135,025,000** |\n| ZYNTH gross margin | 54,010,000 (40.0%) |\n\nClears the 35% floor at the 40% target. **50% deposit on signature**, 25% at week\n7, 25% on the quarter report. Market FX. Vendor lines RFQ-based and reconciled at\nactuals — underspend returns to the client.\n\nLower-budget version: drop two Switch Desks and the onboarding print run\n(−MMK 5,600,000 cost base → 125,700,000 investment). We will not cut the\nperformance board or the measurement — they are the campaign."},{"level":2,"h":"16. WHY ZYNTH","md":"This campaign only works if someone is willing to publish a bad month. Most\nagencies will talk a client out of that in the first meeting, because a bad\nnumber is uncomfortable and comfort is easier to sell. We think the discomfort\nis the entire asset.\n\nWhat we have actually produced: a 20-section fintech launch proposal with full\nsegmentation and scenario modelling; a premium launch event proposal with a\ncomplete vendor and risk register; a manufacturing campaign built on the same\ntransparency mechanic; a spec product film to commercial sound standards; eight\n3D stage and exhibition concepts.\n\nWhat we do not claim: a logistics client. This would be our first, and we would\nrather say so than invent a case study. What we bring is the method, the\nproduction capacity to sustain 32 assets in 14 weeks, and the willingness to\nhold the client to a number in public.\n\n---\n\n*ZYNTH — The Intelligence of Creativity · zynth.asia*\n*Figures indicative, vendor lines subject to RFQ. Market FX. 50% deposit on signature.*"}],"full":true,"words":2497,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_The-Promise-You-Can-Track-Myanmar-Logistics-Delivery-Campaign.docx","docx_kb":44.4},{"id":"The-Village-Gets-The-Report-First-NGO-Impact-Campaign","title":"The Village Gets the Report First — NGO & Social Impact Communications Campaign","file":"vault/ZYNTH-OS/Proposal-Library/The-Village-Gets-The-Report-First-NGO-Impact-Campaign.md","sector":"NGO & Social Impact","market":"Myanmar (programme areas) + Singapore / regional institutional donors","type":"Integrated communications campaign — community accountability, donor confidence, volunteer and staff recruitment","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. CAMPAIGN OVERVIEW","md":"Every NGO in Myanmar produces an annual report. It is written in English, laid\nout for a donor, published on a website the beneficiaries do not read, and\ndistributed to people who were not there.\n\nThe community that lived the programme is the last to hear how it went — if they\nhear at all. And the donor, reading a document produced by the organisation being\nevaluated, quietly discounts it.\n\nBoth audiences are being under-served by the same habit.\n\n**Objective.** Raise institutional donor confidence enough to convert **4 renewals\nand 3 new multi-year commitments**, lift qualified volunteer applications by 140%,\nand establish community reporting as the organisation's signature practice — over\n20 weeks.\n\n**Period.** 20 weeks. **Budget envelope.** MMK 46,000,000 (~S$13,900).\n\n**The bet.** An organisation that reports to the community *before* the donor is\nmaking a claim about itself no press release can make — and it is the single\nstrongest thing a donor can be shown."},{"level":3,"h":"Segment A — The Institutional Donor / Programme Officer","md":"**Demographics.** 30–50, programme or grants officer at an international\nfoundation, bilateral agency, regional CSR fund, or Singapore family office.\nDecides or recommends on grants of USD 50k–2M.\n**Location.** Singapore, Bangkok, Yangon country offices, remote.\n**Psychographics.** Personally answerable for outcomes they cannot observe\ndirectly. Reads dozens of near-identical reports. Deeply sceptical of\nself-assessment and of numbers with no method attached.\n**Pain points.** Cannot verify claimed impact; partners over-promise then\nunder-report; no view of what failed; due-diligence burden with weak evidence;\nreputational exposure if a partner is later found to have overstated.\n**Media.** Email, LinkedIn, sector convenings, peer referral. Reads long\ndocuments when they contain something new."},{"level":3,"h":"Segment B — The Community / Programme Participant","md":"**Demographics.** Adults 20–60 in programme townships; mixed literacy; often the\nhousehold decision-maker on participation.\n**Psychographics.** Has seen organisations arrive, photograph, and leave. Judges\ncredibility by whether someone came back and explained.\n**Pain points.** No idea what happened to the programme after it ended; no channel\nto say it did not work; asked for data repeatedly and never shown the result.\n**Media.** Facebook (mobile), Viber groups, community radio in some areas,\nin-person meetings above all."},{"level":3,"h":"Segment C — The Volunteer / Prospective Staff","md":"**Demographics.** 21–34, graduates and early-career, Yangon and Mandalay.\n**Psychographics.** Wants meaningful work but has heard the sector described as\npolitically fraught and administratively hollow. Looking for evidence of rigour.\n**Pain points.** Cannot tell serious organisations from performative ones; no\nvisibility of what the work actually involves day to day.\n**Media.** Facebook, LinkedIn, TikTok, university networks."},{"level":3,"h":"Segment D — The Domestic Individual Donor","md":"**Demographics.** 28–55, Myanmar professionals and business owners who give.\n**Pain points.** \"Where did the money go\" is unanswered; prefers to give directly\nto people they know rather than to an institution they cannot audit.\n**Media.** Facebook, Viber, word of mouth."},{"level":2,"h":"3. COMPETITIVE LANDSCAPE","md":"\"Competition\" here is for donor confidence and public trust, not market share.\n\n| Who | How they communicate | The gap we take |\n|---|---|---|\n| Large INGOs | Polished English annual reports, professional photography | Community never sees it; reads as institutional, not accountable |\n| Local CSOs | Facebook activity updates, event photos | No method, no outcome measurement, no failure reporting |\n| Direct-giving campaigns | Individual stories, emotional appeal, fast | Cannot demonstrate systemic outcome or sustained delivery |\n| Corporate CSR arms | Brand-led, campaign-shaped | Short-horizon, rarely independently verified |\n\nNobody in this landscape reports to the community first. It costs little and it\nis the one practice a competitor cannot adopt without genuinely changing how they\noperate."},{"level":3,"h":"The big idea — \"The Village Gets the Report First\" / \"အစီရင်ခံစာကို ရွာက အရင်ရမယ်\"","md":"Invert the reporting order. Every programme cycle closes with a **community\nreport-back**: the organisation returns to the township, in Burmese, in person,\nand presents what was spent, what was achieved, what was missed, and what will\nchange. The community responds — on record. Only *then* does the donor report go\nout, and it carries the community's response inside it.\n\nThe donor document stops being a self-assessment. It becomes a transcript.\n\n**Why this and not the obvious one.** The obvious campaign is beneficiary\nportraits, a hopeful score, and \"Together We Can\". Every organisation in the\nsector runs it, which is precisely why a donor discounts it. Reporting to the\ncommunity first is a *behaviour*, not a message — it produces evidence as a\nby-product, and an organisation unwilling to hear the response in public simply\ncannot copy it.\n\n**Brand positioning.** The organisation that answers to the people it serves,\nbefore the people who fund it.\n\n**Key messages.**\n- \"The village hears it first.\" — the reporting order, stated plainly.\n- \"Including what did not work.\" — a named failure in every cycle report.\n- \"Here is the method.\" — measurement approach published alongside every number.\n- \"Ask us on the record.\" — an open community question channel with published answers.\n\n**Tone of voice.** Plain, accountable, unsentimental. **Burmese written first**,\nEnglish transcreated — for this campaign that is not only house rule but the\nargument itself. No rescue framing, no beneficiaries described as passive, no\nimagery that trades on distress.\n\n**Hashtags.** Primary `#ရွာကအရင်သိရမယ်` · Secondary `#VillageFirstReport` `#AskUsOnTheRecord`"},{"level":2,"h":"5. CHANNEL STRATEGY","md":"| Channel | Role | Share |\n|---|---|---|\n| In-community | The report-backs themselves — the campaign's substance, not its promotion | 30% |\n| Facebook | Where Segments B and D live; Burmese-first reporting films | 26% |\n| LinkedIn + email | Segment A donor channel — method notes, cycle reports | 18% |\n| TikTok | Segment C recruitment — the work as it actually is | 12% |\n| Convenings + PR | Sector credibility, peer referral into donor networks | 14% |"},{"level":2,"h":"6. CONTENT PLAN","md":"**Pillars.** The Report-Back 35% · The Method 25% · The Response 25% · The Work 15%.\n\n| Week | The Report-Back | The Method | The Response | The Work |\n|---|---|---|---|---|\n| 1–5 | Township 1 filmed, published (1) | \"How we measure\" explainer (2) | Community Q&A published (1) | Field-team day (2) |\n| 6–10 | Township 2 (1) | \"What we got wrong last cycle\" (1) | Response to hard questions (2) | Recruitment films (2) |\n| 11–15 | Township 3 (1) | Data-collection walkthrough (2) | Independent observer note (1) | Partner org feature (1) |\n| 16–20 | Cycle report + donor pack | Full method annex published | Cumulative response log | Year-ahead commitments (1) |\n\n**Sample draft — Facebook, Week 6 (Burmese first)**\n\n> ပြီးခဲ့တဲ့လက ရေရရှိရေးအစီအစဉ်မှာ ရေတွင်း ၁၄ တွင်း တူးဖို့ ကတိပေးခဲ့ပါတယ်။\n> **၁၁ တွင်း** ပြီးပါပြီ။ ၃ တွင်း မပြီးသေးပါဘူး — မြေအောက်ကျောက်လွှာကြောင့်ပါ။\n> ဒါကို ရွာလူကြီးတွေကို လွန်ခဲ့တဲ့ တနင်္လာနေ့မှာ ကိုယ်တိုင်သွားပြီး ရှင်းပြခဲ့ပါတယ်။\n> သူတို့ရဲ့ အဖြေက ဒီမှာ ရှိပါတယ် — ဖြတ်တောက်ထားခြင်း မရှိပါဘူး။\n>\n> *Last month we committed to 14 wells in the water programme. Eleven are\n> complete. Three are not — the rock layer. We went and explained this to the\n> village committee in person last Monday. Their response is below, uncut.*\n\n**Sample draft — LinkedIn, Week 12 (Segment A)**\n\n> Our Q3 cycle report is attached. Section 4 is titled \"What we did not achieve\"\n> and runs to two pages. Section 7 is the community's recorded response to\n> Section 4, which we did not edit. The measurement annex explains every number's\n> source, including the two we consider unreliable and why. We would rather you\n> find our weaknesses in our own report than in someone else's evaluation."},{"level":2,"h":"7. OUTREACH STRATEGY","md":"| Tier | Who | Deliverable | Fee band (MMK) |\n|---|---|---|---|\n| Sector authority | 2 respected sector figures | Observe a report-back, publish an honest assessment | 1,200,000 each |\n| Academic | 1 university researcher | Independent review of the measurement method | 2,400,000 |\n| Community | 8 community representatives | Speak on record at report-backs | Honorarium + costs only |\n| Recruitment | 3 student-network voices (Segment C) | Field-day content | 500,000 each |\n\nCommunity voices are never paid for endorsement — only honoraria and travel.\nPaying for testimony would destroy the exact asset this campaign is building."},{"level":2,"h":"8. PAID MEDIA PLAN","md":"| Platform | Objective | Budget (MMK) | Audience | Expected |\n|---|---|---|---|---|\n| Facebook | Reach — report-back films | 5,500,000 | Programme townships + Yangon/Mandalay 25–55 | CPM 3,000–4,400 |\n| Facebook | Domestic donor engagement | 3,000,000 | Interest: charity, community, giving; 30–55 | CPL 22,000–34,000 |\n| TikTok | Recruitment (Segment C) | 2,500,000 | 21–32, students and early career | CPV 40–70 |\n| LinkedIn | Donor + sector (Segment A) | 3,000,000 | Foundation, development, CSR titles; SG/TH/regional | CPC 1,600–3,000 |\n| **Total** | | **14,000,000** | | |\n\nDeliberately modest. In this sector paid reach past a point starts to look like\noverhead spent on self-promotion, which damages the very trust being built. The\nbudget sits mostly in the report-backs themselves."},{"level":2,"h":"9. ACTIVATION — THE REPORT-BACKS","md":"**Four community report-backs** across 20 weeks, one per programme township.\nFormat, fixed and published in advance:\n\n1. What we said we would do (10 min, Burmese, printed one-page handout)\n2. What we spent (10 min, itemised, no aggregate hiding)\n3. What we achieved and what we did not (20 min)\n4. **Open floor, recorded and published** (40 min)\n5. What changes next cycle, committed on the spot (10 min)\n\nPlus one **Donor Field Day** — Segment A donors attend a report-back as\nobservers, not guests. They watch the open floor. Nothing is rehearsed for them."},{"level":2,"h":"10. DETAILED BUDGET","md":"| Line | Unit | Qty | Rate (MMK) | Total (MMK) |\n|---|---|---|---|---|\n| Report-back delivery (venue, travel, handouts, interpretation) | event | 4 | 1,650,000 | 6,600,000 |\n| Content production — field crew | day | 12 | 720,000 | 8,640,000 |\n| Editing + subtitling (MM/EN) | asset | 26 | 175,000 | 4,550,000 |\n| Measurement method annex + independent review | pack | 1 | 3,800,000 | 3,800,000 |\n| Paid media (see §8) | — | — | — | 14,000,000 |\n| Authority, academic + recruitment fees | — | — | — | 7,300,000 |\n| Community honoraria + travel | — | — | — | 2,200,000 |\n| Donor Field Day | event | 1 | 2,400,000 | 2,400,000 |\n| Cycle report design + production (MM/EN) | report | 1 | 2,900,000 | 2,900,000 |\n| Campaign management (20 weeks) | month | 5 | 1,850,000 | 9,250,000 |\n| **Subtotal** | | | | **61,640,000** |\n| Contingency 10% | | | | 6,164,000 |\n| **Cost base** | | | | **67,804,000** |"},{"level":2,"h":"11. TIMELINE","md":"| Weeks | Phase | Milestones |\n|---|---|---|\n| 1–3 | Method | Measurement annex drafted, independent reviewer engaged, baseline donor survey |\n| 4–5 | Township 1 | First report-back delivered and filmed |\n| 6–9 | Publish | Films live, method explainers, first failure published |\n| 10 | Township 2 | Second report-back |\n| 11–14 | Donor | Field Day, LinkedIn programme, renewal conversations open |\n| 15 | Township 3 | Third report-back |\n| 16–20 | Close | Township 4, cycle report with community response, donor pack issued |"},{"level":2,"h":"12. KPIs & SUCCESS METRICS","md":"| Metric | Target | Source |\n|---|---|---|\n| Donor renewals secured | 4 | Grant agreements |\n| New multi-year commitments | 3 | Signed agreements |\n| Donor confidence score | +25 points | Donor survey, week 1 vs 20, n=30 |\n| Community report-back attendance | 600 cumulative | Attendance records |\n| Community \"I know what happened\" score | ≥ 75% | Post-event survey, programme townships |\n| Qualified volunteer applications | +140% | Application system |\n| Cycle report downloads (donor/sector) | 900 | Site analytics |\n| Questions answered on record | 100% | Response log |\n\nThe last metric is the one that matters internally. A question asked in public\nand not answered undoes the entire campaign."},{"level":2,"h":"13. ROI PROJECTION","md":"This is not a revenue campaign; return is measured in funding secured and\nretained. Average institutional grant: USD 180,000 over two years.\n\n| Scenario | Renewals | New commitments | Funding secured (USD) | Return on ~S$34k |\n|---|---|---|---|---|\n| Conservative | 3 | 1 | 720,000 | 15× |\n| Base | 4 | 3 | 1,260,000 | 27× |\n| Upside | 5 | 5 | 1,800,000 | 38× |\n\n**Stated carefully:** these are funding outcomes influenced by communications, not\ncaused by them alone. Programme quality, existing relationships and donor cycles\ndrive most of the result. The honest claim is that this campaign removes the\nverification doubt that currently slows or shrinks decisions — it does not\nmanufacture funding, and any agency telling you otherwise is selling you a\nnumber."},{"level":2,"h":"14. RISK & MITIGATION","md":"| Risk | Likelihood | Impact | Mitigation | Owner |\n|---|---|---|---|---|\n| **Do no harm** — published material identifies individuals or locations in ways that create risk for participants | Medium | **Severe** | Protection review before every publication; no GPS, no identifying detail, no faces without informed consent recorded in Burmese; participants may withdraw at any time, including after publication. Any doubt means the asset is not published. | ZYNTH + client protection lead |\n| Community response at open floor is severely critical | **High** | Medium | This is the design working, not failing. Publish it and publish the commitment made in response. Rehearsing the floor would forfeit the entire asset. | Client leadership |\n| Organisation is not operationally ready to answer publicly | Medium | High | Week-1 readiness assessment. If the programme cannot survive an open floor, fix delivery before communications. We will not stage a report-back. | ZYNTH + client |\n| Donor reads published failures as poor performance | Medium | Medium | Frame in the method annex from the first contact; brief donors before the first publication, never after | Client partnerships |\n| Sensitive operating environment restricts filming | **High** | Medium | Audio-only and written formats pre-approved as substitutes; township selection reviewed with the protection lead | Client + ZYNTH |\n| Staff capacity absorbed by report-back preparation | Medium | Medium | Format fixed and templated so cycle two costs a fraction of cycle one | ZYNTH |"},{"level":2,"h":"15. ZYNTH FEE & PROFIT MODEL","md":"| Line | MMK |\n|---|---|\n| Cost base (incl. contingency) | 67,804,000 |\n| **Client investment at 35% margin** | **104,314,000** (~S$31,600) |\n| ZYNTH gross margin | 36,510,000 (35.0%) |\n\n**Priced at the 35% floor, not the 40% target.** This is a deliberate, recorded\nexception: the client's funds are donor funds, and taking target margin on\nrestricted grant money is not a position we want to defend. The floor is the\nfloor — we do not go below it, because a campaign we cannot resource properly\nhelps nobody.\n\n**50% deposit on signature**, 25% at week 10, 25% on the cycle report. Market FX.\nVendor lines RFQ-based, reconciled at actuals; underspend returns to the client."},{"level":2,"h":"16. WHY ZYNTH","md":"This campaign asks an organisation to publish its failures and record the\ncriticism of the people it serves. Most agencies will steer a client away from\nthat within ten minutes, because comfortable work is easier to sell and easier to\napprove. We are proposing it because in this sector the discomfort *is* the\ncredential — and because a donor who watches an unrehearsed open floor stops\nneeding to be convinced.\n\nWhat we have actually produced: a 20-section fintech launch proposal with full\nsegmentation and scenario modelling; a premium launch event proposal with a\ncomplete vendor and risk register; manufacturing, logistics and energy campaigns\nbuilt on the same published-evidence mechanic; a spec product film to commercial\nsound standards; eight 3D stage and exhibition concepts.\n\nWhat we do not claim: an NGO client, or field protection expertise. This would be\nour first in the sector, and the protection review in §14 must be led by the\nclient's own safeguarding lead, not by us. What we bring is the method, the\nbilingual production capacity, and a refusal to make the work look better than it\nis.\n\n---\n\n*ZYNTH — The Intelligence of Creativity · zynth.asia*\n*Figures indicative, vendor lines subject to RFQ. Market FX. Priced at the 35% margin floor by exception — donor-funded work.*"}],"full":true,"words":2844,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_The-Village-Gets-the-Report-First-NGO-Social-Impact-Communications-Cam.docx","docx_kb":45.4},{"id":"Wave-Pay-Premium-Launch-Event","title":"EVENT PROPOSAL: WAVE PAY PREMIUM LAUNCH","file":"vault/ZYNTH-OS/Proposal-Library/Wave-Pay-Premium-Launch-Event.md","sector":"Banking & Finance / Fintech (mobile wallet)","market":"Myanmar (Yangon)","type":"Premium product launch — event","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. EXECUTIVE SUMMARY","md":"WavePay has revolutionized digital payments in Myanmar. Now, as the financial landscape evolves, there is a strategic opportunity to capture the high-value segment: young professionals, entrepreneurs, and SME owners in Yangon. This proposal outlines a comprehensive, high-impact product launch event for WavePay's new premium digital banking feature.\nZYNTH proposes \"The Next Wave: Elevating Your Financial Future,\" an exclusive, tech-forward launch event designed to position WavePay Premium not just as a tool, but as a lifestyle enabler for Myanmar's ambitious professionals.\nSet in the prestigious Crystal Ballroom at LOTTE Hotel Yangon, this event will host 250 carefully curated guests, including VIPs, key media, strategic partners, and high-net-worth individuals. The evening will blend immersive technology, elegant hospitality, and a powerful narrative of financial empowerment. From a futuristic LED tunnel entrance to a dramatic product reveal and high-level networking, every touchpoint is engineered to generate buzz, drive immediate premium user acquisition, and solidify WavePay's market leadership.\nWith a proposed budget of 105,000,000 MMK, ZYNTH will deliver an end-to-end, turnkey solution encompassing creative direction, technical production, vendor management, and seamless execution."},{"level":3,"h":"Theme: \"The Next Wave: Elevating Your Financial Future\"","md":"The narrative centers on progression, sophistication, and seamless control. We are moving from basic transactions to wealth management and premium lifestyle integration."},{"level":3,"h":"Visual Identity","md":"Color Palette: Deep Navy Blue (trust/finance), Metallic Gold (premium/wealth), and Electric Cyan (technology/future).\nTypography: Sleek, modern sans-serif fonts with clean lines.\nImagery: Abstract fluid dynamics (representing the \"wave\" and seamless flow of money), glowing digital nodes, and high-end lifestyle photography."},{"level":3,"h":"Key Experience Moments","md":"The Digital Gateway (Arrival): Guests enter through a custom-built LED tunnel displaying flowing, abstract data streams that react to their movement, symbolizing stepping into the future of finance.\nThe Premium Lounge (Pre-Event): A sophisticated networking space featuring a bespoke cocktail bar, interactive touch-tables demonstrating the app's new features, and ambient electronic-jazz fusion music.\nThe Reveal (Main Show): A high-energy, synchronized light and sound sequence leading into a cinematic 3D projection mapping on the main stage, culminating in the CEO's keynote and the official unveiling of the premium features.\nThe SME Success Panel: A short, impactful discussion featuring top Yangon entrepreneurs discussing how digital finance accelerates their business, providing social proof."},{"level":3,"h":"Mood & Style References","md":"The aesthetic is \"Futuristic Elegance.\" It should feel like a high-end tech keynote (think Apple or Tesla) merged with an exclusive VIP gala. Lighting is moody and architectural, utilizing sharp lasers and soft ambient glows. Materials include brushed metal, dark acrylics, and high-resolution LED surfaces."},{"level":2,"h":"3. EVENT DETAILS","md":"| Category | Detail |\n|---|---|\n| Event Name | The Next Wave: WavePay Premium Launch |\n| Proposed Date | Thursday, September 17, 2026 (Q3) |\n| Time | 5:30 PM – 9:30 PM |\n| Venue | Crystal Ballroom, LOTTE Hotel Yangon |\n| Total Attendance | 250 Guests |\n| Format | Premium Cocktail Reception & Keynote Presentation |"},{"level":3,"h":"Attendance Breakdown","md":"| Guest Category | Target Number | Description |\n|---|---|---|\n| VIPs & Executives | 30 | WavePay C-Suite, Yoma Bank Executives, Regulatory Officials |\n| Media & KOLs | 40 | Top tier tech/business journalists, financial influencers, lifestyle KOLs |\n| Strategic Partners | 50 | Key merchants, corporate partners, telecom representatives |\n| Target Users | 130 | Pre-selected SME owners, young professionals, high-net-worth individuals |"},{"level":3,"h":"Load-in & Setup (Morning - Afternoon)","md":"| Time | Duration | Segment | Owner | Notes |\n|---|---|---|---|---|\n| 08:00 - 12:00 | 4 hrs | Venue Access & Main Production Load-in | Production Manager | Stage, LED, Sound, Lighting setup. |\n| 12:00 - 14:00 | 2 hrs | Technical Setup & Calibration | Technical Director | Sound check, lighting focus, LED content sync. |\n| 14:00 - 16:00 | 2 hrs | Decor & F&B Setup | Event Manager | Floral arrangements, catering stations, lounge setup. |\n| 16:00 - 17:00 | 1 hr | Full Technical Rehearsal | Production Team | Run through all cues, presentations, and AV. |\n| 17:00 - 17:30 | 30 min | Staff Briefing & Final Checks | Event Manager | Guest flow, registration, emergency procedures. |"},{"level":3,"h":"Event (Evening)","md":"| Time | Duration | Segment | Owner | Notes |\n|---|---|---|---|---|\n| 17:30 - 18:00 | 30 min | Guest Arrival & Registration | Registration Team | LED tunnel experience, welcome drinks, networking in Premium Lounge. |\n| 18:00 - 18:30 | 30 min | Welcome Reception & Networking | MC | Ambient music, canapés, interactive feature demos. |\n| 18:30 - 18:45 | 15 min | Opening Remarks & Welcome Address | MC / WavePay Executive | Set the stage, build anticipation. |\n| 18:45 - 19:15 | 30 min | Keynote & Product Reveal: \"The Next Wave\" | WavePay CEO | Cinematic 3D projection mapping, official launch of WavePay Premium. |\n| 19:15 - 19:45 | 30 min | Panel Discussion: \"SME Growth & Digital Finance\" | Moderator & Panelists | Interactive Q&A, real-world applications. |\n| 19:45 - 20:15 | 30 min | Interactive Product Demo & Q&A | WavePay Product Team | Live demonstration of key premium features. |\n| 20:15 - 20:45 | 30 min | Entertainment: Futuristic Dance Performance | Choreographer | High-energy, visually stunning performance. |\n| 20:45 - 21:15 | 30 min | Networking & Closing Remarks | MC | Further networking, call to action for premium sign-ups. |\n| 21:15 - 21:30 | 15 min | Guest Departure | Event Manager | Distribution of premium welcome kits. |"},{"level":3,"h":"Strike (Night)","md":"| Time | Duration | Segment | Owner | Notes |\n|---|---|---|---|---|\n| 21:30 - 00:30 | 3 hrs | Production Strike & Load-out | Production Manager | Dismantle stage, AV, lighting, decor. |\n| 00:30 - 01:30 | 1 hr | Venue Clean-up & Handover | Venue Staff | Final inspection. |"},{"level":3,"h":"Stage Dimensions & Materials","md":"Main Stage: 10m (W) x 5m (D) x 1m (H) with a central thrust extending 3m into the audience.\nMaterials: High-gloss black acrylic finish for a sleek, reflective surface. Integrated LED strips along the edges for dynamic lighting effects.\nBackdrop: Seamless 10m (W) x 4m (H) LED wall as the primary visual element."},{"level":3,"h":"3D Design Brief (Blender)","md":"Main Stage: Model the stage structure with integrated LED strips.\nLED Tunnel Entrance: A 5m long, 3m high, 2.5m wide curved LED tunnel with dynamic content capabilities.\nPremium Lounge: Design a modular lounge area with modern furniture, interactive touch-tables, and a branded bar.\nProduct Reveal Mechanism: Conceptualize a dramatic reveal moment for the WavePay Premium logo/interface on the main LED screen, possibly involving a holographic effect or a physical element rising from the stage."},{"level":3,"h":"Lighting Design","md":"Fixture Types:\nMoving Head Spotlights (e.g., Robe Pointe, Clay Paky Sharpy): 12 units for dynamic beam effects, aerials, and gobos. Positioned on front and side trusses.\nLED Wash Lights (e.g., Chauvet Rogue R2 Wash): 16 units for stage color washes and ambient lighting. Positioned on overhead trusses and floor.\nProfile Spotlights (e.g., ETC Source Four LED Series 2): 4 units for key lighting on speakers and performers, ensuring clear visibility.\nLaser Projectors (e.g., Pangolin FB4-controlled RGB lasers): 2 units for futuristic beam shows and atmospheric effects.\nEffects: Sharp, angular beams in electric cyan and deep blue. Slow, elegant color transitions during networking. High-energy, synchronized light show during product reveal and entertainment segments."},{"level":3,"h":"Sound System Specs","md":"Main PA System: Line array system (e.g., L-Acoustics K2 or d&b audiotechnik J-Series) suitable for the ballroom size, ensuring even coverage and clarity for speech and music.\nMonitors: 4-6 stage monitors for speakers and performers.\nMicrophones: High-quality wireless handheld microphones (e.g., Shure ULXD series) for speakers and panel, lapel mics for key presenters.\nMixing Console: Digital mixing console (e.g., Yamaha CL5 or Avid S6L) with experienced sound engineer."},{"level":3,"h":"LED/Video Content Plan","md":"Pre-Event: Dynamic abstract animations, WavePay branding, countdown timer.\nArrival: Interactive LED tunnel content reacting to guest movement.\nOpening: High-definition WavePay corporate video, animated logo reveals.\nKeynote: Custom-designed presentation slides, embedded video clips, live camera feed of speaker.\nProduct Reveal: Cinematic 3D animation showcasing WavePay Premium features, UI walkthroughs, holographic effects.\nPanel Discussion: Branded lower-thirds, speaker profiles, live camera feed.\nEntertainment: Synchronized visual content complementing the dance performance.\nNetworking: Ambient visuals, social media wall integration."},{"level":3,"h":"Special Effects","md":"Haze Machines: 2-4 units for atmospheric enhancement of lighting beams.\nProjection Mapping: Custom 3D projection mapping onto the main stage and surrounding architectural elements during the product reveal, creating an immersive environment.\nConfetti Cannons: Discreetly placed for a celebratory burst during the peak product reveal moment."},{"level":2,"h":"6. VENDOR REQUIREMENTS","md":"| Category | Recommended Vendor | Scope | Estimated Cost (MMK) | Lead Time | Backup |\n|---|---|---|---|---|---|\n| Stage Construction | Myanmar Event Management Co. (MEMC) | Design, fabrication, installation, and dismantle of main stage, LED tunnel, and lounge structures. | 20,000,000 | 4 weeks | iD Creative Solutions |\n| Lighting | Light & Sound Myanmar | Supply, installation, programming, and operation of all lighting fixtures and effects. | 7,000,000 | 3 weeks | Pro Audio & Lighting |\n| Sound | Pro Audio & Lighting | Supply, installation, calibration, and operation of main PA, monitors, microphones, and mixing console. | 4,000,000 | 3 weeks | Light & Sound Myanmar |\n| LED Screens | Myanmar LED Solutions | Supply, installation, and operation of main LED wall and LED tunnel screens. | 8,000,000 | 3 weeks | Global LED Myanmar |\n| Video Production | Yangon Film Services | Pre-event content creation (corporate video, animations), live camera operation, post-event highlight reel. | 4,000,000 | 6 weeks | Myanmar Motion Pictures |\n| Photography | The Photo Studio Yangon | Event coverage, candid shots, VIP portraits, post-event editing. | 1,500,000 | 2 weeks | Myanmar Photography Group |\n| MC | U Kyaw Kyaw (TBC) | Professional bilingual MC for event flow, introductions, and audience engagement. | 2,000,000 | 4 weeks | Daw Aye Aye (TBC) |\n| DJ/Music | DJ Aura (TBC) | Ambient electronic-jazz fusion for reception, upbeat tracks for networking, specific cues for program. | 1,000,000 | 3 weeks | DJ Zay |\n| Catering | LOTTE Hotel Yangon (In-house) | Premium canapés, finger foods, non-alcoholic beverages, bespoke cocktail bar. | 12,500,000 | 6 weeks | Chatrium Hotel Catering |\n| Florist/Decor | Floral Art Myanmar | Stage floral arrangements, lounge decor, entrance accents. | 2,500,000 | 3 weeks | Yangon Flower Shop |\n| Printing | Print Master Myanmar | Event signage, backdrop printing, VIP invitations, welcome kits. | 1,000,000 | 2 weeks | Express Print Yangon |\n| Fabrication | Custom Props Myanmar | Custom interactive touch-tables, branded display elements. | 3,000,000 | 4 weeks | Event Decor & Props |\n| Security | Venue Security (In-house) | Access control, crowd management, VIP protection. | 1,500,000 | 2 weeks | Private Security Services |\n| Transport | Yangon Limousine Services | VIP transfers, talent transport, logistics support. | 1,000,000 | 2 weeks | Grab Business |"},{"level":2,"h":"7. MARKETING & PROMOTION","md":"ZYNTH will implement a targeted, multi-channel marketing and promotion strategy to maximize event attendance, media coverage, and brand engagement for WavePay Premium."},{"level":3,"h":"Pre-Event (6 Weeks Out)","md":"| Week | Phase | Key Activities | Deliverables | Responsible Party |\n|---|---|---|---|---|\n| Week 1-2 | Strategy & Content | Develop key messaging, visual assets, and content calendar. Identify target media and KOLs. | Event branding guidelines, press kit draft, social media content plan. | ZYNTH Marketing Team |\n| Week 3 | Teaser Campaign | Launch cryptic social media teasers across WavePay and partner channels. Initiate direct outreach to VIPs and early-bird media. | Social media graphics, teaser video (15s), personalized VIP invitations. | ZYNTH Marketing Team, WavePay PR |\n| Week 4 | Official Announcement | Issue press release to tech, business, and lifestyle media. Open limited registration for target users. | Official press release, event microsite/landing page, targeted digital ads. | ZYNTH Marketing Team, WavePay PR |\n| Week 5-6 | Engagement & Outreach | Secure media interviews for WavePay executives. Partner with financial influencers for sponsored content. Send out final event details and reminders. | Media interview schedule, influencer content, event reminder emails/SMS. | ZYNTH Marketing Team, WavePay PR |"},{"level":3,"h":"During-Event","md":"| Activity | Description | Responsible Party |\n|---|---|---|\n| Live Social Media Coverage | Real-time updates, stories, and posts across WavePay and ZYNTH channels. Encourage guest participation with a unique event hashtag. | ZYNTH Social Media Team |\n| Media Relations Desk | Dedicated area for media check-in, press kit distribution, and interview scheduling. | WavePay PR Team |\n| Professional Photography & Videography | Capture key moments, guest interactions, and product demonstrations for post-event use. | ZYNTH Production Team |\n| Interactive Digital Displays | QR codes for immediate WavePay Premium sign-ups, social media wall displaying live posts. | ZYNTH Technical Team |"},{"level":3,"h":"Post-Event (2 Weeks After)","md":"| Week | Phase | Key Activities | Deliverables | Responsible Party |\n|---|---|---|---|---|\n| Week 1 | Content Dissemination | Distribute event highlight video, photo gallery, and post-event press release. Share key takeaways and product benefits. | Highlight video (2-3 min), photo album, post-event press release. | ZYNTH Marketing Team, WavePay PR |\n| Week 2 | Follow-up & Reporting | Send thank-you notes to attendees, media, and partners. Analyze media coverage and social media engagement. | Thank-you emails, media coverage report, social media analytics report. | ZYNTH Marketing Team |"},{"level":2,"h":"8. BUDGET","md":"Exchange Rate: 1 USD = 4,400 MMK\n\n| Item | Description | Qty | Unit Cost (MMK) | Total (MMK) | Total (USD) |\n|---|---|---|---|---|---|\n| A. Venue & Hospitality |  |  |  | 20,000,000 | 4,545.45 |\n| Ballroom Rental (Crystal Ballroom, LOTTE Hotel) | 5:00 PM - 10:00 PM (5 hours) | 1 | 15,000,000 | 15,000,000 | 3,409.09 |\n| Hospitality Staff (Venue) | Ushers, cloakroom, general assistance | 10 | 100,000 | 1,000,000 | 227.27 |\n| Cleaning & Security (Venue) | Post-event cleaning, additional security | 1 | 4,000,000 | 4,000,000 | 909.09 |\n| B. Production & Technical |  |  |  | 48,500,000 | 11,022.73 |\n| Stage Construction | Main stage, LED tunnel, lounge structures | 1 | 20,000,000 | 20,000,000 | 4,545.45 |\n| Lighting Design & Equipment | Fixtures, programming, operation | 1 | 7,000,000 | 7,000,000 | 1,590.91 |\n| Sound System & Engineering | PA, monitors, mics, mixing console | 1 | 4,000,000 | 4,000,000 | 909.09 |\n| LED Screens & Content | Main LED wall, LED tunnel screens, content | 1 | 8,000,000 | 8,000,000 | 1,818.18 |\n| Video Production | Pre-event content, live feed, post-event reel | 1 | 4,000,000 | 4,000,000 | 909.09 |\n| Special Effects | Haze, projection mapping, confetti | 1 | 3,000,000 | 3,000,000 | 681.82 |\n| Technical Crew | AV technicians, stagehands | 8 | 625,000 | 5,000,000 | 1,136.36 |\n| C. Entertainment & Talent |  |  |  | 5,500,000 | 1,250.00 |\n| MC Fee | Professional bilingual MC | 1 | 2,000,000 | 2,000,000 | 454.55 |\n| DJ/Music | Ambient & event music | 1 | 1,000,000 | 1,000,000 | 227.27 |\n| Dance Performance | Futuristic themed performance | 1 | 2,500,000 | 2,500,000 | 568.18 |\n| D. Catering & F&B |  |  |  | 12,500,000 | 2,840.91 |\n| Premium Canapés & Drinks | Per head catering for 250 guests | 250 | 50,000 | 12,500,000 | 2,840.91 |\n| E. Marketing & Collateral |  |  |  | 5,000,000 | 1,136.36 |\n| Photography | Event coverage, editing | 1 | 1,500,000 | 1,500,000 | 340.91 |\n| Printing & Signage | Invitations, backdrops, branding | 1 | 1,000,000 | 1,000,000 | 227.27 |\n| Fabrication (Interactive Displays) | Custom touch-tables, branded elements | 1 | 2,500,000 | 2,500,000 | 568.18 |\n| F. Staffing & Management |  |  |  | 5,000,000 | 1,136.36 |\n| Event Management Team (On-site) | ZYNTH team for coordination & execution | 5 | 1,000,000 | 5,000,000 | 1,136.36 |\n| G. Transport & Logistics |  |  |  | 1,000,000 | 227.27 |\n| VIP & Talent Transport | Limousine services, logistics support | 1 | 1,000,000 | 1,000,000 | 227.27 |\n| Subtotal Project Cost |  |  |  | 99,500,000 | 22,613.64 |\n| H. Contingency (10%) | Unforeseen expenses | 1 | 9,950,000 | 9,950,000 | 2,261.36 |\n| Grand Total Project Cost |  |  |  | 109,450,000 | 24,875.00 |"},{"level":2,"h":"9. ZYNTH PROFIT & COMMERCIAL MODEL","md":"ZYNTH operates on a transparent commercial model, combining project management fees with a tiered pricing structure to offer flexibility and value to our clients.\n\n| Item | Amount (MMK) | Amount (USD) |\n|---|---|---|\n| Total Project Cost (excluding ZYNTH fee) | 109,450,000 | 24,875.00 |\n| ZYNTH Management Fee (18% of Project Cost) | 19,699,000 | 4,477.05 |\n| Total Client Price (Estimated) | 129,149,000 | 29,352.05 |\n| ZYNTH Profit Margin (Estimated) | 19,699,000 | 4,477.05 |"},{"level":3,"h":"Pricing Tiers for Future Engagements","md":"ZYNTH offers flexible engagement models to suit varying client needs and project complexities.\n\n| Tier | Description | Management Fee Percentage |\n|---|---|---|\n| Lean | Basic event management, minimal creative input, focus on execution. | 10-12% |\n| Standard | Comprehensive event management, moderate creative input, full vendor coordination. | 15-18% |\n| Premium | Full-service, bespoke creative direction, extensive production, strategic marketing integration. | 20-25% |"},{"level":2,"h":"10. TIMELINE & PROJECT PLAN","md":"This timeline outlines the key phases and activities from project initiation to post-event wrap-up, spanning approximately 10 weeks.\n\n| Week | Phase | Key Activities | Deliverables | Responsible Party |\n|---|---|---|---|---|\n| Week 1 | Project Kick-off & Planning | Client brief deep dive, team allocation, initial concept refinement, venue confirmation. | Detailed project plan, confirmed venue booking, initial creative brief. | ZYNTH Project Lead, WavePay Marketing |\n| Week 2 | Creative & Design Development | Finalize event concept, visual identity, stage design, and content themes. Vendor selection for key production elements. | Creative concept presentation, 3D stage renderings, vendor contracts (production). | ZYNTH Creative Director, Production Manager |\n| Week 3 | Content & Technical Planning | Develop program flow, script keynotes, plan AV requirements, and content production schedule. | Detailed run of show, speaker scripts, AV technical rider, content production brief. | ZYNTH Event Manager, Technical Director |\n| Week 4 | Marketing & Guest Management | Launch pre-event marketing campaign, finalize guest list, manage invitations and RSVPs. | Marketing campaign launch, guest list database, invitation management system. | ZYNTH Marketing Team, WavePay PR |\n| Week 5 | Production & Fabrication | Begin fabrication of custom stage elements, LED tunnel, and interactive displays. Finalize catering and entertainment. | Production progress reports, catering menu, entertainment contracts. | ZYNTH Production Manager, Event Manager |\n| Week 6 | Content Production & Rehearsals | Produce all video content, presentations, and digital assets. Schedule speaker rehearsals. | Final video content, presentation decks, rehearsal schedule. | ZYNTH Content Team, WavePay Speakers |\n| Week 7 | Logistics & On-site Prep | Finalize all logistical arrangements, transport, staffing schedules. On-site technical checks. | Logistics plan, staff roster, preliminary AV tests. | ZYNTH Event Manager, Technical Director |\n| Week 8 | Event Execution | Full event setup, technical rehearsals, guest management, live event execution. | Successful event delivery. | ZYNTH Full Team |\n| Week 9 | Post-Event & Reporting | Venue strike, financial reconciliation, media monitoring, initial post-event report. | Financial summary, media coverage report, initial post-event analysis. | ZYNTH Project Lead, Finance |\n| Week 10 | Final Deliverables & Review | Deliver final highlight video, photo gallery, and comprehensive event report. Client debrief. | Final event report, highlight video, photo gallery, client feedback session. | ZYNTH Project Lead |"},{"level":2,"h":"11. KPIs & SUCCESS METRICS","md":"Measuring the success of the WavePay Premium launch event is crucial. ZYNTH will track the following Key Performance Indicators (KPIs) to evaluate the event's effectiveness against its objectives.\n\n| Metric | Target | Measurement Method |\n|---|---|---|\n| Media Reach & Impressions | > 5,000,000 impressions | Media monitoring reports, social media analytics, press clipping analysis. |\n| Social Media Engagement | > 1,000 mentions/shares of #WavePayPremiumLaunch | Social media analytics platforms (e.g., Facebook Insights, Twitter Analytics). |\n| Event Attendance | 250 confirmed guests | Registration data, on-site check-in records. |\n| Premium Feature Sign-ups (Immediate) | 10% of attendees sign up for WavePay Premium within 24 hours | WavePay internal data, unique QR code tracking at event. |\n| Premium Feature Sign-ups (1-Month Post-Event) | 25% increase in WavePay Premium user base | WavePay internal data, comparison with pre-event baseline. |\n| Brand Sentiment (Post-Event) | > 80% positive sentiment in media and social discussions | Sentiment analysis tools, qualitative review of media coverage. |\n| Partner/VIP Satisfaction | > 90% satisfaction rating | Post-event survey for VIPs and partners. |\n| Media Coverage Quality | > 10 high-tier media articles/features | Manual review of press clippings for key message inclusion and prominence. |\n| Website/App Traffic (Premium Section) | > 20% increase in traffic to premium feature pages | Google Analytics, WavePay app analytics. |"},{"level":2,"h":"12. RISK REGISTER","md":"Effective risk management is integral to the successful execution of the WavePay Premium launch event. This register identifies potential risks, assesses their likelihood and impact, and outlines mitigation strategies.\n\n| Risk | Likelihood (H/M/L) | Impact (H/M/L) | Mitigation |\n|---|---|---|---|\n| Venue Unavailability/Double Booking | L | H | Confirm booking with signed contract and deposit immediately. Have a secondary venue option (e.g., Novotel Yangon Max) on standby. |\n| Key Speaker/Talent Cancellation | M | H | Secure backup speakers/talent. Draft clear contracts with cancellation clauses. Prepare contingency content (e.g., pre-recorded messages). |\n| Technical Failures (AV, LED, Internet) | M | H | Redundant systems for critical AV components. On-site technical team for immediate troubleshooting. Pre-event full technical rehearsals. |\n| Low Guest Attendance | M | M | Robust marketing and invitation strategy. Personalized follow-ups for VIPs. Engaging content to drive interest. |\n| Negative Media Coverage/Social Media Backlash | L | H | Clear, consistent messaging. Proactive media relations. Crisis communication plan in place. |\n| Budget Overruns | M | M | Strict budget tracking and regular reconciliation. Contingency fund (10%) for unforeseen expenses. |\n| Weather-Related Disruptions | L | M | Indoor venue choice minimizes impact. Contingency plans for guest arrival/departure in heavy rain. |\n| Vendor Non-Performance | M | M | Select reputable vendors with proven track records. Clear contracts with performance clauses. Backup vendors identified. |\n| Product Demo Glitches | M | H | Thorough testing of product features. Multiple devices for demonstration. Backup presentation materials. |\n| Security Breach/Crowd Control Issues | L | H | Professional security personnel. Clear entry/exit protocols. Emergency response plan. |\n| Regulatory/Permit Issues | L | M | Early engagement with local authorities for all necessary permits and licenses. |\n| Logistical Delays (e.g., customs for imported equipment) | M | M | Plan with ample lead time for all imported items. Work with experienced logistics partners. |"},{"level":2,"h":"13. TERMS & CONDITIONS","md":"This section outlines the standard terms and conditions governing the engagement between ZYNTH and WavePay for the \"The Next Wave: WavePay Premium Launch\" event."},{"level":3,"h":"Payment Terms","md":"Deposit: A non-refundable deposit of 50% of the Total Client Price is required upon signing of this proposal to secure services and commence project activities.\nSecond Payment: 30% of the Total Client Price is due 4 weeks prior to the event date.\nFinal Payment: The remaining 20% of the Total Client Price is due within 7 days post-event, upon submission of the final event report and reconciliation.\nAll payments are to be made in Myanmar Kyat (MMK) via bank transfer."},{"level":3,"h":"Cancellation Policy","md":"Cancellation by Client:\nIf cancelled 60 days or more prior to the event date, the 50% deposit will be forfeited.\nIf cancelled between 30-59 days prior to the event date, 75% of the Total Client Price will be payable.\nIf cancelled less than 30 days prior to the event date, 100% of the Total Client Price will be payable.\nCancellation by ZYNTH: In the unlikely event that ZYNTH must cancel the engagement, all payments made by WavePay will be fully refunded.\nForce Majeure: Neither party shall be liable for any failure or delay in performing its obligations under this agreement if such failure or delay is caused by circumstances beyond its reasonable control, including but not limited to acts of God, war, terrorism, civil unrest, natural disasters, or government regulations."},{"level":3,"h":"Scope Boundaries","md":"This proposal details the scope of work for the \"The Next Wave: WavePay Premium Launch\" event as described herein. Any additional services or significant changes to the scope requested by WavePay will be subject to a change order and may incur additional costs and adjustments to the timeline.\nZYNTH is responsible for the planning, coordination, and execution of the event as outlined. WavePay is responsible for providing timely approvals, necessary information, and access to relevant personnel and resources."},{"level":3,"h":"Client Responsibilities","md":"Approvals: Timely review and approval of all creative concepts, production plans, budgets, and marketing materials.\nContent: Provision of all necessary WavePay branding assets, product information, speaker content, and legal disclaimers.\nPersonnel: Availability of key WavePay personnel for meetings, rehearsals, and on-site support as required.\nDecision Making: Prompt decision-making to avoid delays in the project timeline."},{"level":2,"h":"14. WHY ZYNTH","md":"ZYNTH (zynth.asia) is a leading marketing and event management agency with a proven track record of delivering impactful and memorable experiences across Asia. Our commitment to innovation, meticulous execution, and strategic thinking makes us the ideal partner for WavePay's premium product launch."},{"level":3,"h":"Our Credentials","md":"Regional Expertise: Deep understanding of the Myanmar market, cultural nuances, and logistical complexities, ensuring a locally relevant yet globally benchmarked event.\nCreative Excellence: A portfolio of award-winning campaigns and events that push creative boundaries while achieving measurable business objectives.\nTechnical Proficiency: In-house expertise in cutting-edge event technology, including advanced AV, LED, projection mapping, and interactive installations.\nStrategic Partnerships: Extensive network of trusted vendors and suppliers in Yangon, guaranteeing competitive pricing and reliable service."},{"level":3,"h":"Our Differentiators","md":"Integrated Approach: We don't just execute; we integrate your marketing objectives into every aspect of the event, from concept to post-event follow-up.\nData-Driven Decisions: Our strategies are informed by market research and analytics, ensuring every investment yields maximum return.\nTurnkey Solutions: From initial concept to final reporting, ZYNTH provides a seamless, single-point-of-contact experience, allowing WavePay to focus on its core business.\nAgile & Responsive: Our team is equipped to adapt to evolving requirements and unforeseen challenges, ensuring a smooth and stress-free event delivery."},{"level":3,"h":"Our Team","md":"Our dedicated team comprises experienced event strategists, creative directors, technical producers, and marketing specialists, all committed to bringing WavePay's vision to life. Led by a seasoned project manager, the ZYNTH team will work collaboratively with WavePay to ensure every detail is meticulously planned and flawlessly executed."},{"level":2,"h":"REFERENCES","md":"[1] WavePay - App Store. (n.d.). Retrieved from https://apps.apple.com/us/app/wavepay/id1439175549\n[2] WavePay APP by Wave Money. (2026, February 11). Retrieved from https://play.google.com/store/apps/details?id=mm.com.wavemoney.wavepay&hl=en_US\n[3] Wave Money: Advancing Greater Financial Inclusion in Myanmar. (2021, February 17). The Digital Banker. Retrieved from https://thedigitalbanker.com/wave-money-advancing-greater-financial-inclusion-in-myanmar/\n[4] Wave Money - Mobile Financial & Digital Payment in Myanmar. (n.d.). Retrieved from https://wavemoney.com.mm/\n[5] WavePay - Finance App. (n.d.). Retrieved from https://mwm.ai/apps/wavepay/1439175549\n[6] Wave Money and Yoma Bank Team up to Enable Seamless, Secure and Time-Saving Online Fund Transfer for WavePay and Yoma Bank Smart Account Holders. (2020, July 14). Yoma Bank. Retrieved from https://www.yomabank.com/en/news-and-activities/wave-money-and-yoma-bank-team-up-to-enable-seamless-secure-and-time-saving-online-fund-transfer-for-wavepay-and-yoma-bank-smart-account-holders/\n[7] Chatrium Hotel Royal Lake Yangon. (2025, August 16). Facebook. Retrieved from https://www.facebook.com/ChatriumHotelRoyalLakeYangon/posts/%F0%9D%90%82%F0%9D%90%9E%F0%9D%90%A5%F0%9D%90%9E%F0%9D%90%9B%F0%9D%90%AB%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%A2%F0%9D%90%A8%F0%9D%90%A7%F0%9D%90%AC-%F0%9D%90%9A%F0%9D%90%AD-%F0%9D%90%82%F0%9D%90%A1%F0%9D%90%9A%F0%9D%90%AD%F0%9D%90%AB%F0%9D%90%A2%F0%9D%90%AE%F0%9D%90%A6-step-into-timeless-elegance-with-our-grand-ballroom-whe/1149254697233927/\n[8] Melia Yangon Meetings and Events - Hotels. (n.d.). TravelAge West. Retrieved from https://www.travelagewest.com/Hotels/Yangon-Myanmar/Melia-Yangon/Meetings-Events-p52307395\n[9] Sedona Hotel Yangon Meetings & Events. (n.d.). Business Travel News. Retrieved from https://www.businesstravelnews.com/Hotels/Yangon-Myanmar/Sedona-Hotel-Yangon/Meetings-Events-p50741012\n[10] Event spaces - WEDDING & CONFERENCE. (n.d.). LOTTE HOTEL YANGON. Retrieved from https://www.lottehotel.com/yangon-hotel/en/wedding-convention/convention/overview\n[11] Yangon, Myanmar Event Space & Hotel Conference Rooms. (n.d.). Northstar Meetings Group. Retrieved from https://www.northstarmeetingsgroup.com/Meeting-Event-Venues/Yangon-Myanmar/Hotels?pg=2\n[12] Myanmar Event Management Company (MEMC). (n.d.). Myanmar Business Guide. Retrieved from https://www.mmbusinessguide.com/item/myanmar-event-management-company-memc/\n[13] Myanmar's leading Event Organizers & Planners. (n.d.). GCA. Retrieved from https://www.gca.com.mm/blog/our-blog-1/7\n[14] MEMC - Myanmar Event Management Company. (n.d.). Retrieved from https://memc.events/\n[15] Who can provide services for an event in Yangon? (1 year ago). Facebook. Retrieved from https://www.facebook.com/groups/252698328960575/posts/1759901668240226/"}],"full":true,"words":4833,"composed":true,"docx_url":"/docs/2026-08-19_Proposal_EVENT-PROPOSAL-WAVE-PAY-PREMIUM-LAUNCH.docx","docx_kb":51.2},{"id":"Worth-The-Trip-Retail-Mall-Campaign","title":"Worth the Trip — Myanmar Retail & Shopping Mall Footfall Campaign","file":"vault/ZYNTH-OS/Proposal-Library/Worth-The-Trip-Retail-Mall-Campaign.md","sector":"Retail & Shopping Malls (mall operator or multi-store retail group)","market":"Myanmar (Yangon, Mandalay)","type":"Integrated footfall campaign — weekday traffic, dwell time, tenant yield","idea":"","deliverables":[],"kpis":"","investment":"","pricing_model":"none","tiers":[],"edge":"","url":"","doc_url":"","drive_url":"","sections":[{"level":2,"h":"1. CAMPAIGN OVERVIEW","md":"Myanmar malls have a weekday problem that discounts cannot fix.\n\nSaturday is full. Sunday is full. Tuesday afternoon the corridors are empty, the\ntenants are paying rent against a floor that is not converting, and the operator's\nanswer is another sale — which pulls the same weekend crowd forward, cannibalises\nSaturday, and trains everyone to wait for the next promotion.\n\nOnline shopping has already taken the *errand*. What it cannot take is the trip\nthat is worth making for its own sake.\n\n**Objective.** Lift Tuesday–Thursday footfall by **28%**, increase average dwell\ntime by 16 minutes, and raise tenant-reported weekday conversion by 9 points —\nover 16 weeks, without a mall-wide discount event.\n\n**Period.** 16 weeks. **Budget envelope.** MMK 72,000,000.\n\n**The bet.** People do not come to a mall to buy. They come to *be somewhere*.\nGive them a reason to be somewhere on a Wednesday and the buying follows."},{"level":3,"h":"Segment A — The Weekday-Available Parent","md":"**Demographics.** 28–45, majority women, one or two school-age children, not in\nfixed office hours — small business, freelance, or family-managed work.\n**Location.** Within 6km of the centre — Yangon (Hlaing, Insein, Thingangyun,\nSouth Okkalapa), Mandalay Chan Aye Thar Zan and Maha Aung Myay.\n**Psychographics.** The 10 AM–2 PM window is genuinely free and genuinely empty.\nWants somewhere air-conditioned, safe and cheap to spend it, and feels slightly\nguilty about \"just going to the mall\".\n**Behaviours.** Decides that morning, not in advance. Goes where a friend is\ngoing. Buys incidentally, not deliberately.\n**Pain points.** Nothing to do that is not spending; children bored in twenty\nminutes; food court the only reason to stay; no reason to choose Tuesday.\n**Media.** Facebook 8–11 AM and 8–10 PM, Viber mother-and-neighbour groups, TikTok."},{"level":3,"h":"Segment B — The Office Worker Within Walking Distance","md":"**Demographics.** 23–38, offices in and around the centre, 60–90 minute lunch.\n**Psychographics.** Lunch is the only free hour of the day. Currently spends it\nat the same three places.\n**Pain points.** Queues at 12:15; nothing to do after eating; no reason to return\nin the evening.\n**Media.** Facebook, TikTok at lunch, workplace Viber groups."},{"level":3,"h":"Segment C — The Older Weekday Visitor","md":"**Demographics.** 55+, retired or semi-retired, often with grandchildren.\n**Psychographics.** Wants routine, cool air, seating and company. A reliable\nweekly reason to leave the house is worth more than any promotion.\n**Pain points.** Nowhere to sit without buying; nothing scheduled; feels the\nspace is not for them.\n**Media.** Facebook, Viber family groups, word of mouth, community networks."},{"level":3,"h":"Segment D — The Tenant (internal, and the actual client of the result)","md":"**Demographics.** Store managers and owners across 60–140 units.\n**Psychographics.** Sceptical of mall marketing because past campaigns drove\nfootfall that never entered their store.\n**Pain points.** Pays marketing levy, sees no attributable return; not told what\nis happening until it happens; cannot staff for traffic nobody forecast.\n**Why they are an audience.** A campaign the tenants do not know about converts\nat a fraction of one they helped plan."},{"level":2,"h":"3. COMPETITIVE LANDSCAPE","md":"| Who | What they do | The gap we take |\n|---|---|---|\n| Other malls | Weekend events, seasonal sales, celebrity appearances | All competing for the same Saturday; weekday is conceded |\n| Delivery + e-commerce | Convenience, price, no trip required | Cannot give you somewhere to be |\n| Street markets | Price, proximity, social familiarity | Heat, rain, no seating, no safety for children |\n| Cafés and co-working | The weekday hang-out, small scale | Cannot host a family or a hundred people |\n\nEvery operator is fighting for the weekend and abandoning four days a week. The\nweekday is not a weak market — it is an unclaimed one."},{"level":3,"h":"The big idea — \"Worth the Trip\" / \"လာရကျိုးနပ်တယ်\"","md":"Stop advertising what is on sale. **Programme the week.**\n\nEvery weekday gets a fixed, free, recurring reason to come — the same thing, the\nsame time, every week, for the whole campaign and beyond. Not events. A\n**timetable**. A mall people can plan their week around, the way they plan arou
